<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vizsgafüzet – Kulturális ismereti vizsga</title>
<meta name="description" content="Magyar kulturális ismereti vizsga – leckék, szókincs, vizsgakérdések és próbavizsga magyarul, angolul és törökül.">
<meta name="theme-color" content="#1d1d1b">
<meta property="og:title" content="Vizsgafüzet – Kulturális ismereti vizsga">
<meta property="og:description" content="Leckék, vizsgakérdések és próbavizsga a magyar kulturális ismereti vizsgához.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='11' fill='%23c8102e'/%3E%3Crect y='11' width='32' height='10' fill='%23fff'/%3E%3Crect y='21' width='32' height='11' fill='%232e6b45'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--surface:#f5f4f0;--ink:#1d1d1b;--muted:#5f5e58;--line:#e3e1db;--chip:#ecebe6;--red:#c8102e;--green:#2e6b45;--ok:#2e6b45;--bad:#c8102e;--okbg:#e8f2eb;--badbg:#fbe9ec;--hl:#fff3c4;
--display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;--body:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1d1b;--surface:#27271f;--ink:#f2f1ec;--muted:#b0afa7;--line:#3b3b34;--chip:#31312a;--red:#ef4a5c;--green:#62b57f;--ok:#6cc58b;--bad:#ff6b7c;--okbg:#1f3427;--badbg:#3c2028;--hl:#4a4220;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1d1b;--surface:#27271f;--ink:#f2f1ec;--muted:#b0afa7;--line:#3b3b34;--chip:#31312a;--red:#ef4a5c;--green:#62b57f;--ok:#6cc58b;--bad:#ff6b7c;--okbg:#1f3427;--badbg:#3c2028;--hl:#4a4220;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
a{color:inherit}button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px;border-radius:8px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.narrow{max-width:760px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.015em;line-height:1.12}
/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-weight:800;font-size:20px;white-space:nowrap}
.flag{display:inline-grid;grid-template-rows:1fr 1fr 1fr;width:6px;height:24px;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.flag i:nth-child(1){background:#c8102e}.flag i:nth-child(2){background:#fff}.flag i:nth-child(3){background:#2e6b45}
nav.main{display:flex;gap:2px;margin-left:12px}
nav.main a{text-decoration:none;padding:8px 11px;border-radius:999px;font-size:15px;color:var(--muted);white-space:nowrap}
nav.main a:hover{color:var(--ink);background:var(--surface)}
nav.main a[aria-current]{color:var(--ink);background:var(--chip);font-weight:600}
.tools{display:flex;gap:6px;margin-left:auto;align-items:center}
.ib{border:1px solid var(--line);background:var(--bg);border-radius:999px;height:38px;min-width:38px;padding:0 11px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;gap:6px}
.ib:hover{border-color:var(--ink)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;height:38px}
.lang button{border:0;background:none;border-radius:999px;padding:0 10px;font-size:14px;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.menubtn{display:none}
.sheet{display:none;border-top:1px solid var(--line);padding:10px 20px 16px;background:var(--bg)}
.sheet.open{display:block}
.sheet a{display:block;padding:12px 4px;border-bottom:1px solid var(--line);text-decoration:none;font-weight:600}
@media (max-width:980px){nav.main{display:none}.menubtn{display:inline-flex}}
@media (max-width:420px){.brand span.nm{display:none}}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:12px 22px;font-weight:700;text-decoration:none;border:1.5px solid var(--ink);cursor:pointer;background:transparent;min-height:46px}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.sm{padding:7px 16px;font-size:15px;min-height:38px}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* home */
.hero{text-align:center;padding:56px 0 40px}
.emblem{width:150px;height:150px;margin:0 auto 22px;display:block;color:var(--ink)}
.hero h1{font-weight:800;font-size:clamp(34px,5.4vw,60px);line-height:1.04;margin:0 auto 16px;max-width:15em;letter-spacing:-.025em}
.hero p{font-size:19px;color:var(--muted);max-width:33em;margin:0 auto 26px}
.hero .row{justify-content:center}
.glance{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:18px;margin:8px 0 0;overflow:hidden}
.glance div{padding:18px 20px;border-right:1px solid var(--line)}
.glance div:last-child{border-right:0}
.glance b{display:block;font-family:var(--display);font-size:34px;font-weight:800;line-height:1}
.glance span{color:var(--muted);font-size:15px}
@media (max-width:640px){.glance{grid-template-columns:1fr 1fr}.glance div:nth-child(2){border-right:0}.glance div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
section{padding:44px 0}
.sh{font-size:30px;font-weight:700;margin:0 0 6px}
.ss{color:var(--muted);margin:0 0 24px;max-width:42em}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:28px;counter-reset:s}
.steps li{counter-increment:s;border-top:3px solid var(--ink);padding-top:14px}
.steps li::before{content:counter(s);font-family:var(--display);font-weight:800;font-size:15px;color:var(--muted)}
.steps h3{font-size:20px;margin:4px 0 6px}
.steps p{margin:0 0 10px;color:var(--muted);font-size:16px}
.steps a{font-weight:700;font-size:15px}
@media (max-width:820px){.steps{grid-template-columns:1fr 1fr}}@media (max-width:480px){.steps{grid-template-columns:1fr}}
.continue{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:var(--surface);border-radius:18px;padding:18px 22px;margin-bottom:22px}
.chl{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.chl a{display:grid;grid-template-columns:48px 1fr auto;gap:16px;align-items:center;padding:18px 6px;border-bottom:1px solid var(--line);text-decoration:none}
.chl a:hover{background:var(--surface)}
.chl .ic{font-size:28px;text-align:center}
.chl .t{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.2;display:block}
.chl .s{color:var(--muted);font-size:15px}
.prog{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);white-space:nowrap}
.pbar{width:90px;height:6px;background:var(--chip);border-radius:9px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--green)}
@media (max-width:560px){.pbar{display:none}}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.res a{display:block;padding:16px 18px;border:1px solid var(--line);border-radius:14px;text-decoration:none}
.res a:hover{border-color:var(--ink)}.res b{display:block}.res span{color:var(--muted);font-size:15px}
/* page head */
.crumb{font-size:15px;color:var(--muted);padding-top:26px;margin:0}
.crumb a{color:var(--muted)}
.ph h1{font-weight:800;font-size:clamp(30px,4.4vw,46px);margin:8px 0 6px;letter-spacing:-.02em}
.ph p.sub{color:var(--muted);margin:0 0 20px;font-size:18px}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 24px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:12px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--red)}
/* lesson notes */
.note2{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding:16px 0;border-bottom:1px solid var(--line)}
.note2 .hu{font-size:18px}
.note2 .en{color:var(--muted)}
@media (max-width:720px){.note2{grid-template-columns:1fr;gap:4px}}
.hu-mode .en,.hu-mode .qe,.hu-mode .note2{grid-template-columns:1fr}
.hu-mode .en,.hu-mode .qe{display:none!important}
.tip{background:var(--hl);border-radius:12px;padding:12px 16px;margin:20px 0;font-size:16px}
.pager{display:flex;justify-content:space-between;gap:12px;margin:36px 0 10px;flex-wrap:wrap}
/* vocab table */
.vt{width:100%;border-collapse:collapse}
.vt td{padding:11px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.vt td:first-child{font-weight:700;width:48%}
.vt td:last-child{color:var(--muted)}
.vt tr.k td:first-child::after{content:" ✓";color:var(--green)}
/* flashcard */
.fc{perspective:1200px;max-width:520px;margin:0 auto}
.fc .card{position:relative;height:240px;cursor:pointer;transform-style:preserve-3d;transition:transform .45s}
.fc .card.flip{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;border:1px solid var(--line)}
.fc .face b{font-family:var(--display);font-size:clamp(24px,5vw,34px);line-height:1.15}
.fc .face small{color:var(--muted);margin-top:12px;font-size:14px}
.fc .back{transform:rotateY(180deg);background:var(--okbg)}
.fc .back .ansl{font-size:18px;font-weight:600;max-height:180px;overflow:auto}
.fc .back .ansl ul{text-align:left;margin:0;padding-left:20px}
.fcbar{display:flex;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.count{text-align:center;color:var(--muted);font-size:14px;margin-bottom:10px}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media (max-width:760px){.chips{flex-wrap:nowrap;overflow-x:auto;margin-left:-20px;margin-right:-20px;padding:0 20px 4px;scrollbar-width:none}}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:4px;margin:0 0 20px}
.seg button{border:0;background:none;padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--muted);font-size:15px}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
/* questions list */
.qs{list-style:none;padding:0;margin:0}
.qs li{border-bottom:1px solid var(--line)}
.qs summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:14px;padding:16px 4px;align-items:start}
.qs summary::-webkit-details-marker{display:none}
.qs .qt{font-weight:600}
.qs .qe{display:block;color:var(--muted);font-size:15px;font-weight:400}
.qs .body{padding:0 4px 18px}
.ab{background:var(--okbg);border-radius:12px;padding:12px 16px;font-weight:600}
.ab ul{margin:0;padding-left:20px}.ab .en{font-weight:400;margin-top:4px}
.qnote{font-size:15px;color:var(--muted);margin:10px 0 0}
.learn{display:inline-flex;align-items:center;gap:8px;margin-top:12px;font-size:15px;cursor:pointer}
.learn input{width:20px;height:20px;accent-color:var(--green)}
.done .qt{color:var(--muted)}.done .qt::after{content:" ✓";color:var(--green)}
.freq{display:inline-flex;align-items:center;font-weight:700;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:13px;white-space:nowrap}
.tag{display:inline-block;font-size:13px;color:var(--muted);margin-top:4px}
.search{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:13px 16px;background:var(--bg);font-size:17px;margin:0 0 14px}
.search:focus{border-color:var(--ink);outline:none}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.empty{color:var(--muted);padding:24px 0}
/* quiz */
.quiz{background:var(--surface);border-radius:22px;padding:26px;max-width:720px}
.quiz .top{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:10px;gap:10px;flex-wrap:wrap;align-items:center}
.quiz h2{font-size:24px;margin:0 0 4px}
.opts{display:grid;gap:10px;margin:20px 0 0}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:13px 16px;cursor:pointer;font-weight:600;display:flex;gap:12px;align-items:flex-start}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted)}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt[disabled]{cursor:default}
.fb{margin-top:16px}.fb .full{color:var(--muted);font-size:15px;margin-top:6px}.fb .full ul{margin:2px 0;padding-left:20px}
.qprog{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:16px}.qprog i{display:block;height:100%;background:var(--ink);transition:width .3s}
.score{font-family:var(--display);font-weight:800;font-size:64px;line-height:1;margin:6px 0}
.verdict{display:inline-block;border-radius:999px;padding:4px 14px;font-weight:700;font-size:15px}
.verdict.pass{background:var(--okbg);color:var(--ok)}.verdict.fail{background:var(--badbg);color:var(--bad)}
.review{list-style:none;padding:0;margin:20px 0 0}
.review li{padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.review .y{color:var(--bad)}.review .c{color:var(--ok);font-weight:600}
/* exam info */
.facts{display:grid;grid-template-columns:200px 1fr;border-top:1px solid var(--line);margin:0}
.facts dt,.facts dd{padding:14px 0;border-bottom:1px solid var(--line);margin:0}
.facts dt{font-weight:700;padding-right:16px}
@media (max-width:600px){.facts{grid-template-columns:1fr}.facts dt{border-bottom:0;padding-bottom:0}}
.timeline{list-style:none;padding:0;margin:0}
.timeline li{display:grid;grid-template-columns:110px 1fr;padding:12px 0;border-bottom:1px solid var(--line)}
.timeline b{font-family:var(--display)}
footer{border-top:1px solid var(--line);margin-top:48px;padding:32px 0 44px;color:var(--muted);font-size:15px}
footer .cols{display:grid;grid-template-columns:2fr 1fr 1fr;gap:28px}
footer h4{color:var(--ink);margin:0 0 8px;font-size:15px}
footer ul{list-style:none;padding:0;margin:0}footer li{margin:4px 0}
footer a{color:var(--muted)}
@media (max-width:700px){footer .cols{grid-template-columns:1fr 1fr}footer .cols>div:first-child{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fb,.ab{animation:pop .22s ease-out}
.mbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:10;display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 16px;margin:0 0 16px;font-size:15px}
.mq{border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;margin:0 0 14px;background:var(--bg)}
.mq .top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px;margin-bottom:6px}
.mq h3{font-size:20px;margin:4px 0 4px}
.mq .mtype{font-size:13px;color:var(--muted);margin:0 0 4px;text-transform:none}
.mq.good{border-color:var(--ok)}.mq.badq{border-color:var(--bad)}.mq.part{border-color:#d9a400}
.opt.radio{position:relative}.opt.radio input{position:absolute;opacity:0;pointer-events:none}
.opt.radio.sel{border-color:var(--ink);background:var(--surface)}.opt.radio.sel .k{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.c{color:var(--ok)}.y{color:var(--bad)}
.fig{margin:18px 0;padding:18px;background:#fbfaf6;border:1px solid var(--line);border-radius:18px;color:#1d1d1b}
.fig figcaption{font-size:14px;color:#6b6a64;margin-top:10px;text-align:center}
.fig svg{display:block;margin:0 auto;max-width:100%;height:auto}
.flagrow,.coarow{display:flex;gap:20px;align-items:center;justify-content:center;flex-wrap:wrap}
.flagrow svg{flex:0 1 220px}
.flagkey,.coakey{margin:0;padding-left:0;list-style:none;font-size:16px;flex:1 1 220px}
.coakey{padding-left:20px;list-style:decimal}ul.coakey{list-style:disc}.coakey li,.flagkey li{margin:6px 0}
.flagkey i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:8px}
.fig .en{color:#6b6a64}
.insig{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.insig b{display:block;font-size:15px}.insig span{display:block;font-size:13px}
.tline{list-style:none;margin:0;padding:0 0 0 18px;border-left:3px solid #c8102e}
.tline li{position:relative;display:grid;grid-template-columns:92px 1fr;gap:10px;padding:7px 0;font-size:16px}
.tline li::before{content:"";position:absolute;left:-26px;top:13px;width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid #2e6b45}
.tline b{font-family:var(--display)}.tline small{display:block;font-size:13px}
.hu-mode .fig .en{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <a class="brand" href="#home"><span class="flag" aria-hidden="true"><i></i><i></i><i></i></span><span class="nm">Vizsgafüzet</span></a>
    <nav class="main" id="nav" aria-label="Main"></nav>
    <div class="tools">
      <a class="ib" href="#search" id="searchBtn" aria-label="Search">🔍</a>
      <div class="lang" role="group" aria-label="Language"><button data-lang="en">EN</button><button data-lang="hu">HU</button><button data-lang="tr">TR</button></div>
      <button class="ib" id="themeBtn" aria-label="Light / dark">🌙</button>
      <button class="ib menubtn" id="menuBtn" aria-expanded="false" aria-label="Menu">☰</button>
    </div>
  </div>
  <div class="sheet" id="sheet"></div>
</header>
<main id="app"></main>
<footer><div class="wrap cols" id="foot"></div></footer>
<script>
const CH=[{"id":1,"hu":"Nemzeti jelképek és ünnepek","en":"National symbols and holidays","ic":"🇭🇺","notes":[["A legfontosabb nemzeti jelképek: a zászló, a Szent Korona, a Himnusz és Magyarország címere.","The main national symbols: the flag, the Holy Crown, the national anthem (Himnusz) and the coat of arms."],
["A zászló színei felülről lefelé: piros, fehér, zöld. A piros az erőt, a fehér a hűséget, a zöld a reményt jelképezi.","Flag colours from top to bottom: red, white, green. Red stands for strength, white for fidelity, green for hope."],
["A címer bal oldala: vörössel és ezüsttel hétszer vágott mező. Jobb oldala: hármas halom, rajta korona és kettős kereszt.","Coat of arms, left side: a field cut seven times in red and silver. Right side: a triple hill with a crown and a double cross."],
["A Himnuszt Kölcsey Ferenc írta (1823), Erkel Ferenc zenésítette meg. A Szózatot Vörösmarty Mihály írta (1836), Egressy Béni zenésítette meg.","The Himnusz was written by Ferenc Kölcsey (1823) and set to music by Ferenc Erkel. The Szózat was written by Mihály Vörösmarty (1836) and set to music by Béni Egressy."],
["Koronázási jelvények: Szent Korona, koronázási jogar, országalma, koronázási kard, koronázási palást. A Szent Korona az Országházban tekinthető meg.","Coronation insignia: Holy Crown, sceptre, orb, coronation sword, coronation mantle. The Holy Crown is on display in the Parliament building."],
["Nemzeti ünnepeken az Országház előtt felvonják a nemzeti lobogót.","On national holidays the national flag is raised in front of the Parliament."],
["Nemzeti ünnepek: március 15. (1848–49), augusztus 20. (államalapítás, Szent István), október 23. (1956).","National holidays: 15 March (1848–49), 20 August (foundation of the state, St Stephen), 23 October (1956)."],
["A Himnusz első sora: „Isten, áldd meg a magyart”. A Szózat első sora: „Hazádnak rendületlenül légy híve, oh magyar”.","The anthem begins “Isten, áldd meg a magyart” (God, bless the Hungarians). The Szózat begins “Hazádnak rendületlenül légy híve, oh magyar” (Be faithful to your homeland, Hungarian)."]]},
{"id":2,"hu":"Magyarország történelme","en":"History of Hungary","ic":"🏰","notes":[["Honfoglalás: a hét magyar törzs 895–896-ban érkezett a Kárpát-medencébe és telepedett le ott.","The Conquest (honfoglalás): the seven Hungarian tribes arrived and settled in the Carpathian Basin in 895–896."],
["I. (Szent) István az első keresztény magyar király; 1001. január 1-jén koronázták meg. Bevezette a római katolikus vallást, tíz egyházmegyét alapított és kiépítette a vármegyerendszert.","St Stephen I was the first Christian king, crowned on 1 January 1001. He introduced Roman Catholicism, founded ten dioceses and set up the county system."],
["Az Aranybullát II. András adta ki; a nemesek jogait rögzítette.","The Golden Bull was issued by Andrew II and set down the rights of the nobles."],
["A tatárjárás (1241–1242) okozta a jelentős középkori elnéptelenedést.","The Mongol invasion (1241–1242) caused the great medieval depopulation."],
["Nándorfehérvár, 1456: győzelem Hunyadi János vezetésével. Hunyadi Mátyás a kiemelkedő reneszánsz uralkodó.","Nándorfehérvár (Belgrade), 1456: victory led by János Hunyadi. Matthias Hunyadi (Corvinus) was the great Renaissance king."],
["1848–49: forradalom és szabadságharc a Habsburg-ház ellen. Görgei Artúr Világosnál tette le a fegyvert (1849. augusztus 13.). Batthyány Lajos miniszterelnököt 1849. október 6-án végezték ki.","1848–49: revolution and war of independence against the Habsburgs. Artúr Görgei surrendered at Világos (13 August 1849). Prime Minister Lajos Batthyány was executed on 6 October 1849."],
["Széchenyi István a „legnagyobb magyar”; nevéhez kötődik a Széchenyi Lánchíd.","István Széchenyi is “the greatest Hungarian”; the Chain Bridge is linked to his name."],
["1956: forradalom a szovjet megszállás és a kommunista diktatúra ellen.","1956: revolution against Soviet occupation and the communist dictatorship."],
["Rendszerváltás: 1990-ben alakult meg az első kormány. Antall József az első demokratikusan megválasztott miniszterelnök, Göncz Árpád az első köztársasági elnök.","Change of regime: the first government formed in 1990. József Antall was the first democratically elected prime minister, Árpád Göncz the first president."],
["A kiegyezéstől (1867) az első világháborúig (1914) tartó időszakot gyakran Magyarország egyik aranykorának tartják.","The period from the Compromise (1867) to WWI (1914) is often called one of Hungary’s golden ages."],
["Koronázó városok: Buda, Esztergom, Székesfehérvár, Pozsony, Sopron.","Coronation cities: Buda, Esztergom, Székesfehérvár, Pozsony (Bratislava), Sopron."]]},
{"id":3,"hu":"Irodalom és zenetörténet","en":"Literature and music","ic":"🎼","notes":[["Zeneszerzők és műveik: Erkel Ferenc – Bánk bán (opera); Liszt Ferenc – Magyar rapszódiák; Bartók Béla – A kékszakállú herceg vára (opera); Kodály Zoltán – Háry János (daljáték).","Composers and works: Ferenc Erkel – Bánk bán (opera); Franz Liszt – Hungarian Rhapsodies; Béla Bartók – Bluebeard’s Castle (opera); Zoltán Kodály – Háry János (singspiel)."],
["A népzenekutatás két leghíresebb alakja: Bartók Béla és Kodály Zoltán.","The two best-known folk music researchers: Béla Bartók and Zoltán Kodály."],
["Költők, írók: Petőfi Sándor (19. sz.), Jókai Mór (romantika), Ady Endre (20. sz.), József Attila.","Poets and writers: Sándor Petőfi (19th c.), Mór Jókai (Romanticism), Endre Ady (20th c.), Attila József."],
["Reneszánsz írók: Janus Pannonius és Balassi Bálint. A Szigeti veszedelmet Zrínyi Miklós írta. A nyelvújítás vezéralakja Kazinczy Ferenc.","Renaissance writers: Janus Pannonius and Bálint Balassi. Zrínyi Miklós wrote The Peril of Sziget. Ferenc Kazinczy led the language reform."],
["Az EU himnusza: Beethoven IX. szimfóniájának 4. tétele, az Örömóda; a szöveg Schiller verse.","The EU anthem: the 4th movement of Beethoven’s 9th Symphony, the Ode to Joy; the text is Schiller’s poem."],
["A Bánk bán Katona József drámája; Erkel Ferenc operát írt belőle. Shakespeare angol drámaíró (pl. Hamlet, Rómeó és Júlia).","Bánk bán is a drama by József Katona; Erkel turned it into an opera. Shakespeare was an English playwright (e.g. Hamlet, Romeo and Juliet)."]]},
{"id":4,"hu":"Alaptörvény és állami intézmények","en":"Fundamental Law and state institutions","ic":"⚖️","notes":[["Az Alaptörvény Magyarország alkotmánya, a legmagasabb jogi erejű norma. Az Országgyűlés 2011-ben fogadta el, 2012. január 1-jén lépett hatályba.","The Fundamental Law is Hungary’s constitution and the highest legal norm. Parliament adopted it in 2011; it came into force on 1 January 2012."],
["Az Országgyűlés a legfőbb népképviseleti szerv: 199 képviselő, 4 évre. Ő választja a miniszterelnököt.","Parliament (Országgyűlés) is the supreme representative body: 199 members, elected for 4 years. It elects the prime minister."],
["A miniszterelnök vezeti a Kormányt. A Kormány irányítja a közigazgatást, jogszabályokat alkot, működteti az állami ellátórendszereket.","The prime minister leads the Government, which runs public administration, makes regulations and operates state services."],
["Az államfő a köztársasági elnök: kifejezi a nemzet egységét, őrködik a demokratikus működés felett, a Honvédség főparancsnoka. 5 évre választják, egyszer választható újra.","The head of state is the President: expresses national unity, guards democratic operation and is commander-in-chief. Elected for 5 years, can be re-elected once."],
["A bíróságok függetlenek; a minisztériumok nem részei az igazságszolgáltatásnak. Nem minisztérium például a Kúria és az Alkotmánybíróság.","Courts are independent; ministries are not part of the judiciary. The Curia and the Constitutional Court are not ministries."],
["Az Európai Tanácsban Magyarországot a miniszterelnök képviseli.","Hungary is represented in the European Council by the prime minister."]]},
{"id":5,"hu":"Alapvető jogok és kötelezettségek","en":"Fundamental rights and duties","ic":"🕊️","notes":[["Jogegyenlőség: minden állampolgár egyenlő a törvény előtt. A polgári társadalmak a 17–18. században léptek fel érte.","Equality before the law: every citizen is equal before the law. Civil societies fought for it in the 17th–18th centuries."],
["Halálbüntetés nincs: az Alkotmánybíróság 1990-ben alkotmányellenesnek nyilvánította.","There is no death penalty: the Constitutional Court declared it unconstitutional in 1990."],
["Első generációs jogok: élet, személyi szabadság, egyesülés és gyülekezés, lelkiismeret és vallás, szólás és sajtó.","First-generation rights: life, personal liberty, association and assembly, conscience and religion, speech and press."],
["Második generációs jogok: munka, sztrájk, oktatás, szociális biztonság.","Second-generation rights: work, strike, education, social security."],
["Harmadik generációs jogok: egészséges környezet, gyermekek, betegek, fogyatékkal élők jogai.","Third-generation rights: healthy environment, rights of children, patients and people with disabilities."],
["Az Emberi és Polgári Jogok Nyilatkozata (1789) francia eredetű.","The Declaration of the Rights of Man and of the Citizen (1789) is French."],
["A legrégebbi felekezetek: Magyar Katolikus Egyház, Magyarországi Református Egyház, Magyarországi Evangélikus Egyház.","The oldest denominations: the Catholic, Reformed and Lutheran churches of Hungary."]]},
{"id":6,"hu":"Európa és Magyarország a mindennapokban","en":"Hungary and Europe in everyday life","ic":"🗺️","notes":[["Magyarország köztársaság; népessége kb. 9,6 millió, területe kb. 93 ezer km², 19 vármegyéje van. Budapestnek 23 kerülete van.","Hungary is a republic; population about 9.6 million, area about 93,000 km², 19 counties. Budapest has 23 districts."],
["2004. május 1. óta EU-tag (az EU-nak 27 tagállama van), 2007 óta a schengeni térség tagja, 1999 óta NATO-tag.","EU member since 1 May 2004 (the EU has 27 member states), in Schengen since 2007, in NATO since 1999."],
["Szomszédok: Ausztria, Szlovákia, Ukrajna, Románia, Szerbia, Horvátország, Szlovénia.","Neighbours: Austria, Slovakia, Ukraine, Romania, Serbia, Croatia, Slovenia."],
["Folyók: Duna, Tisza, Dráva, Rába. Legnagyobb tavak: Balaton, Fertő tó, Velencei-tó.","Rivers: Danube, Tisza, Drava, Rába. Largest lakes: Balaton, Lake Fertő, Lake Velence."],
["Tájegységek: Alföld, Kisalföld, Északi-középhegység, Alpokalja, Dunántúli-dombság, Dunántúli-középhegység.","Regions: Great Plain, Little Plain, North Hungarian Mountains, Alpokalja, Transdanubian Hills, Transdanubian Mountains."],
["Hungarikum: tipikusan magyar alkotás, tárgy vagy szokás – pl. gulyásleves, tokaji aszú, pálinka. Fűszerpaprika: Kalocsa és Szeged.","Hungarikum: something typically Hungarian – e.g. goulash soup, Tokaji aszú, pálinka. Ground paprika: Kalocsa and Szeged."],
["A Budai vár és a Magyar Állami Operaház Budapesten található.","Buda Castle and the Hungarian State Opera are in Budapest."]]}];

const TRCH=[
{t:"Ulusal semboller ve bayramlar",n:["Başlıca ulusal semboller: bayrak, Kutsal Taç, milli marş (Himnusz) ve devlet arması.","Bayrağın renkleri yukarıdan aşağıya: kırmızı, beyaz, yeşil. Kırmızı gücü, beyaz sadakati, yeşil umudu simgeler.","Armanın sol tarafı: kırmızı ve gümüş renkte yedi kez bölünmüş alan. Sağ tarafı: üzerinde taç ve çift haç olan üçlü tepe.","Himnusz’u Ferenc Kölcsey yazdı (1823), Ferenc Erkel besteledi. Szózat’ı Mihály Vörösmarty yazdı (1836), Béni Egressy besteledi.","Taç giyme nişanları: Kutsal Taç, asa, hükümranlık küresi, taç giyme kılıcı, taç giyme pelerini. Kutsal Taç Parlamento binasında sergilenir.","Ulusal bayramlarda Parlamento önünde ulusal bayrak göndere çekilir.","Ulusal bayramlar: 15 Mart (1848–49), 20 Ağustos (devletin kuruluşu, Aziz István), 23 Ekim (1956).","Himnusz şöyle başlar: “Isten, áldd meg a magyart” (Tanrım, Macarları kutsa). Szózat şöyle başlar: “Hazádnak rendületlenül légy híve, oh magyar” (Ey Macar, vatanına sarsılmadan bağlı ol)."]},
{t:"Macaristan tarihi",n:["Yurt edinme (honfoglalás): yedi Macar boyu 895–896’da Karpat Havzası’na gelip yerleşti.","I. (Aziz) István ilk Hristiyan kraldır, 1 Ocak 1001’de taç giydi. Roma Katolikliğini getirdi, on piskoposluk kurdu ve il (vármegye) sistemini oluşturdu.","Altın Bulla’yı II. András yayımladı; soyluların haklarını belirledi.","Moğol istilası (1241–1242) büyük Orta Çağ nüfus kaybına yol açtı.","Nándorfehérvár (Belgrad), 1456: Hunyadi János önderliğinde zafer. Hunyadi Mátyás (Korvin) büyük Rönesans kralıdır.","1848–49: Habsburglara karşı devrim ve bağımsızlık savaşı. Artúr Görgei Világos’ta teslim oldu (13 Ağustos 1849). Başbakan Lajos Batthyány 6 Ekim 1849’da idam edildi.","István Széchenyi “en büyük Macar”dır; Zincirli Köprü onun adıyla anılır.","1956: Sovyet işgaline ve komünist diktatörlüğe karşı devrim.","Rejim değişikliği: ilk hükümet 1990’da kuruldu. József Antall demokratik yolla seçilen ilk başbakan, Árpád Göncz ilk cumhurbaşkanıdır.","Uzlaşma’dan (1867) I. Dünya Savaşı’na (1914) kadar olan dönem genellikle Macaristan’ın altın çağlarından biri sayılır.","Taç giyme şehirleri: Buda, Esztergom, Székesfehérvár, Pozsony (Bratislava), Sopron."]},
{t:"Edebiyat ve müzik tarihi",n:["Besteciler ve eserleri: Erkel Ferenc – Bánk bán (opera); Liszt Ferenc – Macar Rapsodileri; Bartók Béla – Mavi Sakal’ın Şatosu (opera); Kodály Zoltán – Háry János (şarkılı oyun).","Halk müziği araştırmasının en ünlü iki ismi: Béla Bartók ve Zoltán Kodály.","Şairler ve yazarlar: Sándor Petőfi (19. yy), Mór Jókai (romantizm), Endre Ady (20. yy), Attila József.","Rönesans yazarları: Janus Pannonius ve Bálint Balassi. Sziget Felaketi’ni Miklós Zrínyi yazdı. Dil reformunun öncüsü Ferenc Kazinczy’dir.","AB marşı: Beethoven’ın 9. Senfonisi’nin 4. bölümü, Neşeye Övgü; sözleri Schiller’in şiiri.","Bánk bán, József Katona’nın dramıdır; Erkel bunu operaya dönüştürdü. Shakespeare İngiliz oyun yazarıdır (ör. Hamlet, Romeo ve Juliet)."]},
{t:"Temel Yasa ve devlet kurumları",n:["Temel Yasa Macaristan’ın anayasası ve en yüksek hukuki normdur. Parlamento 2011’de kabul etti; 1 Ocak 2012’de yürürlüğe girdi.","Parlamento (Országgyűlés) en yüksek temsil organıdır: 199 milletvekili, 4 yıllığına seçilir. Başbakanı Parlamento seçer.","Başbakan Hükümeti yönetir. Hükümet kamu yönetimini yürütür, düzenlemeler yapar ve devlet hizmetlerini işletir.","Devlet başkanı cumhurbaşkanıdır: ulusun birliğini ifade eder, demokratik işleyişi gözetir ve başkomutandır. 5 yıllığına seçilir, bir kez yeniden seçilebilir.","Mahkemeler bağımsızdır; bakanlıklar yargının parçası değildir. Kúria ve Anayasa Mahkemesi bakanlık değildir.","Avrupa Konseyi’nde Macaristan’ı başbakan temsil eder."]},
{t:"Temel haklar ve yükümlülükler",n:["Hak eşitliği: her vatandaş yasa önünde eşittir. Sivil toplumlar bunun için 17.–18. yüzyıllarda mücadele etti.","İdam cezası yoktur: Anayasa Mahkemesi 1990’da anayasaya aykırı ilan etti.","Birinci kuşak haklar: yaşam, kişi özgürlüğü, örgütlenme ve toplanma, vicdan ve din, ifade ve basın.","İkinci kuşak haklar: çalışma, grev, eğitim, sosyal güvenlik.","Üçüncü kuşak haklar: sağlıklı çevre, çocuk, hasta ve engelli hakları.","İnsan ve Yurttaş Hakları Bildirgesi (1789) Fransız kökenlidir.","En eski mezhepler: Macaristan Katolik, Reformcu ve Lüteriyen kiliseleri."]},
{t:"Gündelik hayatta Macaristan ve Avrupa",n:["Macaristan bir cumhuriyettir; nüfusu yaklaşık 9,6 milyon, yüzölçümü yaklaşık 93 bin km², 19 ili vardır. Budapeşte’nin 23 ilçesi vardır.","1 Mayıs 2004’ten beri AB üyesi (AB’nin 27 üyesi var), 2007’den beri Schengen’de, 1999’dan beri NATO üyesi.","Komşular: Avusturya, Slovakya, Ukrayna, Romanya, Sırbistan, Hırvatistan, Slovenya.","Nehirler: Tuna, Tisza, Drava, Rába. En büyük göller: Balaton, Fertő, Velence.","Bölgeler: Büyük Ova, Küçük Ova, Kuzey Macaristan Dağları, Alpokalja, Transdanubya Tepeleri, Transdanubya Dağları.","Hungarikum: tipik Macar ürün ya da gelenek – örn. gulaş çorbası, Tokaji aszú, pálinka. Toz paprika: Kalocsa ve Szeged.","Buda Kalesi ve Macar Devlet Operası Budapeşte’dedir."]}];

function chList(){return `<ul class="chl">${CH.map(ch=>{const[d,n]=progOf(ch.id),p=Math.round(d/n*100);return `<li><a href="#l${ch.id}"><span class="ic" aria-hidden="true">${ch.ic}</span><span><span class="t">${esc(L==='hu'?ch.hu:ch.hu)}</span><span class="s">${L!=='hu'?esc(chH(ch))+' · ':''}${n} ${t('qn')}</span></span><span class="prog"><span class="pbar"><i style="width:${p}%"></i></span>${d}/${n}</span></a></li>`}).join('')}</ul>`}
function qItem(q,opt={}){const hl=s=>opt.hl?mark(s,opt.hl):esc(s);
  return `<li class="${learned.has(q.id)?'done':''}" data-q="${q.id}"><details${opt.open?' open':''}><summary><span><span class="qt">${hl(q.q)}</span><span class="qe">${hl(hq(q))}</span>${opt.ch?`<span class="tag">${CH[q.c-1].ic} ${esc(chName(q.c))}</span>`:''}</span>${badge(q)}</summary><div class="body"><div class="ab">${ansHTML(q.a)}<div class="en">${esc(ha(q))}</div></div>${q.note?`<p class="qnote">ℹ️ ${esc(q.note)}</p>`:''}<label class="learn"><input type="checkbox" ${learned.has(q.id)?'checked':''} data-l="${q.id}"> ${t('know')}</label></div></details></li>`}
function mark(s,term){const n=norm(s),i=n.indexOf(term);if(i<0)return esc(s);return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+term.length))+'</mark>'+esc(s.slice(i+term.length))}
