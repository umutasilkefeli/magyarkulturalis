<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--surface:#f5f4f0;--ink:#1d1d1b;--muted:#5f5e58;--line:#e3e1db;--chip:#ecebe6;--red:#c8102e;--green:#2e6b45;--ok:#2e6b45;--bad:#c8102e;--okbg:#e8f2eb;--badbg:#fbe9ec;--hl:#fff3c4;
--display:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--body:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1d1b;--surface:#27271f;--ink:#f2f1ec;--muted:#b0afa7;--line:#3b3b34;--chip:#31312a;--red:#ef4a5c;--green:#62b57f;--ok:#6cc58b;--bad:#ff6b7c;--okbg:#1f3427;--badbg:#3c2028;--hl:#4a4220;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1d1b;--surface:#27271f;--ink:#f2f1ec;--muted:#b0afa7;--line:#3b3b34;--chip:#31312a;--red:#ef4a5c;--green:#62b57f;--ok:#6cc58b;--bad:#ff6b7c;--okbg:#1f3427;--badbg:#3c2028;--hl:#4a4220;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
a{color:inherit}button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px;border-radius:8px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.narrow{max-width:760px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.015em;line-height:1.25;font-weight:700}
/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-weight:700;font-size:17px;white-space:nowrap}
.flag{display:inline-grid;grid-template-rows:1fr 1fr 1fr;width:6px;height:24px;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.flag i:nth-child(1){background:#c8102e}.flag i:nth-child(2){background:#fff}.flag i:nth-child(3){background:#2e6b45}
nav.main{display:flex;gap:2px;margin-left:12px}
nav.main a{text-decoration:none;padding:7px 9px;border-radius:8px;font-size:14px;color:var(--muted);white-space:nowrap}
nav.main a:hover{color:var(--ink);background:var(--surface)}
nav.main a[aria-current]{color:var(--ink);background:var(--chip);font-weight:600}
.tools{display:flex;gap:6px;margin-left:auto;align-items:center}
.ib{border:1px solid var(--line);background:var(--bg);border-radius:10px;height:36px;min-width:36px;padding:0 11px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;gap:6px}
.ib:hover{border-color:var(--ink)}.ib.on{border-color:var(--green)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;height:38px}
.lang button{border:0;background:none;border-radius:7px;padding:0 10px;font-size:14px;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.menubtn{display:none}
.sheet{display:none;border-top:1px solid var(--line);padding:10px 20px 16px;background:var(--bg)}
.sheet.open{display:block}
.sheet a{display:block;padding:12px 4px;border-bottom:1px solid var(--line);text-decoration:none;font-weight:600}
@media (max-width:1260px){nav.main{display:none}.menubtn{display:inline-flex}}
@media (max-width:420px){.brand span.nm{display:none}}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:11px 20px;font-weight:600;font-size:15px;text-decoration:none;border:1.5px solid var(--ink);cursor:pointer;background:transparent;min-height:46px}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.sm{padding:7px 14px;font-size:14px;min-height:36px}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* home */
.hero{text-align:center;padding:56px 0 40px}
.emblem{width:110px;height:110px;margin:0 auto 22px;display:block;color:var(--ink)}
.hero h1{font-weight:700;font-size:clamp(25px,3.4vw,38px);line-height:1.2;margin:0 auto 14px;max-width:18em;letter-spacing:-.02em}
.hero p{font-size:16px;color:var(--muted);max-width:33em;margin:0 auto 26px}
.hero .row{justify-content:center}
.glance{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:12px;margin:8px 0 0;overflow:hidden}
.glance div{padding:18px 20px;border-right:1px solid var(--line)}
.glance div:last-child{border-right:0}
.glance b{display:block;font-family:var(--display);font-size:22px;font-weight:700;line-height:1}
.glance span{color:var(--muted);font-size:15px}
@media (max-width:640px){.glance{grid-template-columns:1fr 1fr}.glance div:nth-child(2){border-right:0}.glance div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
section{padding:44px 0}
.sh{font-size:20px;font-weight:700;margin:0 0 6px}
.ss{color:var(--muted);margin:0 0 24px;max-width:42em}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:28px;counter-reset:s}
.steps li{counter-increment:s;border-top:3px solid var(--ink);padding-top:14px}
.steps li::before{content:counter(s);font-family:var(--display);font-weight:800;font-size:15px;color:var(--muted)}
.steps h3{font-size:15px;margin:4px 0 6px}
.steps p{margin:0 0 10px;color:var(--muted);font-size:16px}
.steps a{font-weight:700;font-size:15px}
@media (max-width:820px){.steps{grid-template-columns:1fr 1fr}}@media (max-width:480px){.steps{grid-template-columns:1fr}}
.continue{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:var(--surface);border-radius:12px;padding:18px 22px;margin-bottom:22px}
.chl{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.chl a{display:grid;grid-template-columns:48px 1fr auto;gap:16px;align-items:center;padding:18px 6px;border-bottom:1px solid var(--line);text-decoration:none}
.chl a:hover{background:var(--surface)}
.chl .ic{font-size:24px;text-align:center}
.chl .t{font-family:var(--display);font-weight:600;font-size:16px;line-height:1.2;display:block}
.chl .s{color:var(--muted);font-size:15px}
.prog{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);white-space:nowrap}
.pbar{width:90px;height:6px;background:var(--chip);border-radius:9px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--green)}
@media (max-width:560px){.pbar{display:none}}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.res a{display:block;padding:16px 18px;border:1px solid var(--line);border-radius:10px;text-decoration:none}
.res a:hover{border-color:var(--ink)}.res b{display:block}.res span{color:var(--muted);font-size:15px}
/* page head */
.crumb{font-size:15px;color:var(--muted);padding-top:26px;margin:0}
.crumb a{color:var(--muted)}
.ph h1{font-weight:700;font-size:clamp(22px,2.8vw,29px);margin:8px 0 6px;letter-spacing:-.02em}
.ph p.sub{color:var(--muted);margin:0 0 20px;font-size:15px}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 24px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:12px 14px;font-weight:600;font-size:15px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--red)}
/* lesson notes */
.note2{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding:16px 0;border-bottom:1px solid var(--line)}
.note2 .hu{font-size:15.5px}
.note2 .en{color:var(--muted)}
@media (max-width:720px){.note2{grid-template-columns:1fr;gap:4px}}
.hu-mode .en,.hu-mode .qe,.hu-mode .note2{grid-template-columns:1fr}
.hu-mode .en,.hu-mode .qe{display:none!important}
.tip{background:var(--hl);border-radius:12px;padding:12px 16px;margin:20px 0;font-size:16px}
.pager{display:flex;justify-content:space-between;gap:12px;margin:36px 0 10px;flex-wrap:wrap}
/* vocab table */
.vt{width:100%;border-collapse:collapse}
.vt td{padding:11px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.vt td:first-child{font-weight:700;width:48%}
.vt td:last-child{color:var(--muted)}
.vt tr.k td:first-child::after{content:" ✓";color:var(--green)}
/* flashcard */
.fc{perspective:1200px;max-width:520px;margin:0 auto}
.fc .card{position:relative;height:240px;cursor:pointer;transform-style:preserve-3d;transition:transform .45s}
.fc .card.flip{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;border:1px solid var(--line)}
.fc .face b{font-family:var(--display);font-size:clamp(19px,3.4vw,24px);line-height:1.15}
.fc .face small{color:var(--muted);margin-top:12px;font-size:14px}
.fc .back{transform:rotateY(180deg);background:var(--okbg)}
.fc .back .ansl{font-size:18px;font-weight:600;max-height:180px;overflow:auto}
.fc .back .ansl ul{text-align:left;margin:0;padding-left:20px}
.fcbar{display:flex;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.count{text-align:center;color:var(--muted);font-size:14px;margin-bottom:10px}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media (max-width:760px){.chips{flex-wrap:nowrap;overflow-x:auto;margin-left:-20px;margin-right:-20px;padding:0 20px 4px;scrollbar-width:none}}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:4px;margin:0 0 20px}
.seg button{border:0;background:none;padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--muted);font-size:15px}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
/* questions list */
.qs{list-style:none;padding:0;margin:0}
.qs li{border-bottom:1px solid var(--line)}
.qs summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:14px;padding:16px 4px;align-items:start}
.qs summary::-webkit-details-marker{display:none}
.qs .qt{font-weight:600}
.qs .qe{display:block;color:var(--muted);font-size:15px;font-weight:400}
.qs .body{padding:0 4px 18px}
.ab{background:var(--okbg);border-radius:12px;padding:12px 16px;font-weight:600}
.ab ul{margin:0;padding-left:20px}.ab .en{font-weight:400;margin-top:4px}
.qnote{font-size:15px;color:var(--muted);margin:10px 0 0}
.learn{display:inline-flex;align-items:center;gap:8px;margin-top:12px;font-size:15px;cursor:pointer}
.learn input{width:20px;height:20px;accent-color:var(--green)}
.done .qt{color:var(--muted)}.done .qt::after{content:" ✓";color:var(--green)}
.freq{display:inline-flex;align-items:center;font-weight:700;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:13px;white-space:nowrap}
.tag{display:inline-block;font-size:13px;color:var(--muted);margin-top:4px}
.search{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:13px 16px;background:var(--bg);font-size:17px;margin:0 0 14px}
.search:focus{border-color:var(--ink);outline:none}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.empty{color:var(--muted);padding:24px 0}
/* quiz */
.quiz{background:var(--surface);border-radius:14px;padding:24px;max-width:720px}
.quiz .top{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:10px;gap:10px;flex-wrap:wrap;align-items:center}
.quiz h2{font-size:17px;margin:0 0 4px}
.opts{display:grid;gap:10px;margin:20px 0 0}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:13px 16px;cursor:pointer;font-weight:600;display:flex;gap:12px;align-items:flex-start}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted)}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt[disabled]{cursor:default}
.fb{margin-top:16px}.fb .full{color:var(--muted);font-size:15px;margin-top:6px}.fb .full ul{margin:2px 0;padding-left:20px}
.qprog{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:16px}.qprog i{display:block;height:100%;background:var(--ink);transition:width .3s}
.score{font-family:var(--display);font-weight:700;font-size:38px;line-height:1;margin:6px 0}
.verdict{display:inline-block;border-radius:999px;padding:4px 14px;font-weight:700;font-size:15px}
.verdict.pass{background:var(--okbg);color:var(--ok)}.verdict.fail{background:var(--badbg);color:var(--bad)}
.review{list-style:none;padding:0;margin:20px 0 0}
.review li{padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.review .y{color:var(--bad)}.review .c{color:var(--ok);font-weight:600}
/* exam info */
.facts{display:grid;grid-template-columns:200px 1fr;border-top:1px solid var(--line);margin:0}
.facts dt,.facts dd{padding:14px 0;border-bottom:1px solid var(--line);margin:0}
.facts dt{font-weight:700;padding-right:16px}
@media (max-width:600px){.facts{grid-template-columns:1fr}.facts dt{border-bottom:0;padding-bottom:0}}
.timeline{list-style:none;padding:0;margin:0}
.timeline li{display:grid;grid-template-columns:110px 1fr;padding:12px 0;border-bottom:1px solid var(--line)}
.timeline b{font-family:var(--display)}
footer{border-top:1px solid var(--line);margin-top:48px;padding:32px 0 44px;color:var(--muted);font-size:15px}
footer .cols{display:grid;grid-template-columns:2fr 1fr 1fr;gap:28px}
footer h4{color:var(--ink);margin:0 0 8px;font-size:15px}
footer ul{list-style:none;padding:0;margin:0}footer li{margin:4px 0}
footer a{color:var(--muted)}
@media (max-width:700px){footer .cols{grid-template-columns:1fr 1fr}footer .cols>div:first-child{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fb,.ab{animation:pop .22s ease-out}
.mbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:10;display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 16px;margin:0 0 16px;font-size:15px}
.mq{border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px;margin:0 0 14px;background:var(--bg)}
.mq .top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px;margin-bottom:6px}
.mq h3{font-size:16px;margin:4px 0 4px}
.mq .mtype{font-size:13px;color:var(--muted);margin:0 0 4px;text-transform:none}
.mq.good{border-color:var(--ok)}.mq.badq{border-color:var(--bad)}.mq.part{border-color:#d9a400}
.opt.radio{position:relative}.opt.radio input{position:absolute;opacity:0;pointer-events:none}
.opt.radio.sel{border-color:var(--ink);background:var(--surface)}.opt.radio.sel .k{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.c{color:var(--ok)}.y{color:var(--bad)}
.fig{margin:18px 0;padding:18px;background:#fbfaf6;border:1px solid var(--line);border-radius:12px;color:#1d1d1b}
.fig figcaption{font-size:14px;color:#6b6a64;margin-top:10px;text-align:center}
.fig svg{display:block;margin:0 auto;max-width:100%;height:auto}
.flagrow,.coarow{display:flex;gap:20px;align-items:center;justify-content:center;flex-wrap:wrap}
.flagrow svg{flex:0 1 220px}
.flagkey,.coakey{margin:0;padding-left:0;list-style:none;font-size:16px;flex:1 1 220px}
.coakey{padding-left:20px;list-style:decimal}ul.coakey{list-style:disc}.coakey li,.flagkey li{margin:6px 0}
.flagkey i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:8px}
.fig .en{color:#6b6a64}
.insig{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.insig b{display:block;font-size:15px}.insig span{display:block;font-size:13px}
.tline{list-style:none;margin:0;padding:0 0 0 18px;border-left:3px solid #c8102e}
.tline li{position:relative;display:grid;grid-template-columns:92px 1fr;gap:10px;padding:7px 0;font-size:16px}
.tline li::before{content:"";position:absolute;left:-26px;top:13px;width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid #2e6b45}
.tline b{font-family:var(--display)}.tline small{display:block;font-size:13px}
.hu-mode .fig .en{display:none!important}
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px}
.mbox{background:var(--bg);color:var(--ink);border-radius:14px;padding:22px;max-width:420px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.mbox h3{margin:0 0 8px;font-size:21px}.mbox p{margin:0 0 18px;color:var(--muted)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.fl{display:block;font-weight:700;font-size:15px;margin:0 0 8px}
textarea.search{resize:vertical;font:inherit;min-height:120px}

svg.i{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}.ib .i{width:19px;height:19px}.lk{width:.9em;height:.9em;opacity:.7}.chip .i,.opt .i{margin-right:2px}.tag .i,.qnote .i{width:1em;height:1em}
nav.main a[data-k="unlock"]{color:var(--green);font-weight:600}
.e{font-style:normal;line-height:1}.lk{font-size:.85em;opacity:.8}
.buybig{width:100%;margin-top:14px;padding:14px 20px;font-size:16px}
.fine{color:var(--muted);font-size:13.5px;margin:10px 0 0}
.buysteps{margin:16px 0 0;padding-left:20px;font-size:14.5px;color:var(--muted)}.buysteps li{margin:6px 0}.buysteps b{color:var(--ink)}
.paidnote{background:var(--okbg);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.fullbox{display:grid;grid-template-columns:1fr 220px;gap:24px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:24px;background:var(--surface)}
.eyebrow{margin:0 0 4px;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--green)}
.fulllist{margin:0;padding-left:18px;color:var(--muted);font-size:14.5px}.fulllist li{margin:4px 0}

<script>
const CH=[{"id":1,"hu":"Nemzeti jelképek és ünnepek","en":"National symbols and holidays","ic":"🇭🇺","notes":[["A legfontosabb nemzeti jelképek: a zászló, a Szent Korona, a Himnusz és Magyarország címere.","The main national symbols: the flag, the Holy Crown, the national anthem (Himnusz) and the coat of arms.","En önemli ulusal semboller: bayrak, Kutsal Taç, milli marş (Himnusz) ve devlet arması."],["A zászló színei felülről lefelé: piros, fehér, zöld. A piros az erőt, a fehér a hűséget, a zöld a reményt jelképezi. Nemzeti ünnepeken az Országház előtt felvonják a nemzeti lobogót.","Flag colours top to bottom: red, white, green – strength, fidelity, hope. On national holidays the flag is raised in front of Parliament.","Bayrak renkleri yukarıdan aşağıya: kırmızı, beyaz, yeşil – güç, sadakat, umut. Milli bayramlarda Parlamento önünde göndere çekilir."],["A címer elemei: bal oldalon vörössel és ezüsttel hétszer vágott mező; jobb oldalon hármas halom, rajta korona és kettős kereszt; a pajzs tetején a Szent Korona.","Coat of arms: left – a field cut seven times in red and silver; right – a triple hill with a crown and a double cross; on top – the Holy Crown.","Arma: solda kırmızı-gümüş yedi kez bölünmüş alan; sağda üzerinde taç ve çift haç olan üçlü tepe; en üstte Kutsal Taç."],["Himnusz: Kölcsey Ferenc verse (1823), zenéjét Erkel Ferenc szerezte. Szózat: Vörösmarty Mihály írta (1836), Egressy Béni zenésítette meg; nemzeti ünnepeken gyakran a Himnusz mellett énekeljük.","Himnusz: poem by Ferenc Kölcsey (1823), music by Ferenc Erkel. Szózat: written by Mihály Vörösmarty (1836), music by Béni Egressy; often sung alongside the anthem.","Himnusz: Kölcsey Ferenc’in şiiri (1823), bestesi Erkel Ferenc. Szózat: Vörösmarty Mihály yazdı (1836), Egressy Béni besteledi; milli bayramlarda marşla birlikte sık söylenir."],["Koronázási jelvények (az egykori királyi hatalom jelképei): Szent Korona, országalma, koronázási kard, koronázási jogar, koronázási palást. A Szent Korona az Országházban tekinthető meg; az Alaptörvény szerint megtestesíti az alkotmányos állami folytonosságot és a nemzet egységét.","Coronation insignia (symbols of former royal power): Holy Crown, orb, sword, sceptre, mantle. The Holy Crown is in the Parliament building; under the Fundamental Law it embodies constitutional continuity and national unity.","Taç giyme nişanları (eski kraliyet gücünün sembolleri): Kutsal Taç, küre, kılıç, asa, pelerin. Kutsal Taç Parlamento’dadır; Temel Yasa’ya göre anayasal devlet sürekliliğini ve ulusun birliğini temsil eder."],["Egykori koronázó városok: Buda, Esztergom, Pozsony, Sopron, Székesfehérvár.","Former coronation cities: Buda, Esztergom, Pozsony (Bratislava), Sopron, Székesfehérvár.","Eski taç giyme şehirleri: Buda, Esztergom, Pozsony (Bratislava), Sopron, Székesfehérvár."],["Nemzeti ünnepek: március 15. (az 1848–49-es forradalom és szabadságharc), augusztus 20. (az államalapítás és Szent István), október 23. (az 1956-os forradalom és szabadságharc).","National holidays: 15 March (1848–49 revolution), 20 August (foundation of the state, St Stephen), 23 October (1956 revolution).","Milli bayramlar: 15 Mart (1848–49 devrimi), 20 Ağustos (devletin kuruluşu, Aziz István), 23 Ekim (1956 devrimi)."],["A Himnusz első sora: „Isten, áldd meg a magyart”. A Szózat első sora: „Hazádnak rendületlenül légy híve, oh magyar”.","The anthem begins “Isten, áldd meg a magyart” (God, bless the Hungarians). The Szózat begins “Hazádnak rendületlenül légy híve, oh magyar”.","Himnusz: “Isten, áldd meg a magyart” (Tanrım, Macarları kutsa). Szózat: “Hazádnak rendületlenül légy híve, oh magyar” (Ey Macar, vatanına sarsılmadan bağlı ol)."]],"tr":"Ulusal semboller ve bayramlar"},{"id":2,"hu":"Magyarország történelme","en":"History of Hungary","ic":"🏰","notes":[["Honfoglalás (895–896): több száz éves sztyeppei vándorlás után Árpád vezetésével a hét magyar törzs elfoglalta a Kárpát-medencét és letelepedett.","The Conquest (895–896): after centuries of migration on the steppe, the seven Hungarian tribes led by Árpád took the Carpathian Basin and settled.","Yurt edinme (895–896): yüzyıllarca bozkırda göçün ardından Árpád önderliğindeki yedi Macar boyu Karpat Havzası’na yerleşti."],["I. (Szent) István, az államalapító: 1001. január 1-jén koronázták meg, ő az első keresztény király. Az ország a nyugati kereszténységet és a római katolikus vallást választotta; kiépítette a vármegyerendszert, egyházmegyéket és püspökségeket alapított.","St Stephen I, founder of the state: crowned 1 January 1001, first Christian king. Hungary chose Western Christianity (Roman Catholic); he set up counties and founded dioceses and bishoprics.","Devletin kurucusu I. (Aziz) István: 1 Ocak 1001’de taç giydi, ilk Hristiyan kral. Batı Hristiyanlığı (Roma Katolikliği) seçildi; il sistemini kurdu, piskoposluklar tesis etti."],["Középkor (XI–XIV. sz.): jelentős Árpád-házi királyok Szent László és Könyves Kálmán. 1222: II. András kiadta az Aranybullát (a nemesek jogai). 1241–42: tatárjárás; IV. Béla, „a második honalapító” újjáépítette az országot. 1301: III. András halálával kihalt az Árpád-ház.","Middle Ages (11th–14th c.): notable Árpád kings St Ladislaus and Coloman. 1222: Andrew II issued the Golden Bull (nobles’ rights). 1241–42: Mongol invasion; Béla IV, “the second founder”, rebuilt the country. 1301: the Árpád dynasty died out with Andrew III.","Orta Çağ (11.–14. yy): önemli Árpád kralları Aziz László ve Könyves Kálmán. 1222: II. András Altın Bulla’yı yayımladı (soyluların hakları). 1241–42: Moğol istilası; “ikinci kurucu” IV. Béla ülkeyi yeniden kurdu. 1301: III. András’ın ölümüyle Árpád hanedanı sona erdi."],["XV. század: 1456-ban Nándorfehérvárnál (ma Belgrád) Hunyadi János győzött; 70 évre megállította a török terjeszkedést – erre emlékeztet a déli harangszó. Hunyadi Mátyás (1458–1490) alatt a reneszánsz fénykora, Európa egyik legerősebb állama.","15th century: in 1456 János Hunyadi won at Nándorfehérvár (Belgrade), halting Ottoman expansion for 70 years – the noon bell recalls it. Under Matthias Hunyadi (1458–1490): the Renaissance golden age.","15. yüzyıl: 1456’da Hunyadi János Nándorfehérvár’da (Belgrad) kazandı, Osmanlı ilerleyişini 70 yıl durdurdu – öğle çanı bunu anar. Hunyadi Mátyás (1458–1490): Rönesans’ın altın çağı."],["Török hódoltság (1526–1686): 1526. augusztus 29-én súlyos vereség Mohácsnál. 1541-ben a törökök elfoglalták Budát, az ország kb. 150 évre három részre szakadt (kiemelkedő Eger ostroma, 1552). 1686. szeptember 2-án a Habsburg vezetésű keresztény sereg visszafoglalta Budát.","Ottoman era (1526–1686): heavy defeat at Mohács on 29 August 1526. In 1541 the Ottomans took Buda and the country split into three for ~150 years (siege of Eger, 1552). On 2 September 1686 a Habsburg-led Christian army retook Buda.","Osmanlı dönemi (1526–1686): 29 Ağustos 1526 Mohaç’ta ağır yenilgi. 1541’de Buda alındı, ülke ~150 yıl üçe bölündü (Eğri kuşatması, 1552). 2 Eylül 1686’da Habsburg önderliğindeki Hristiyan ordu Buda’yı geri aldı."],["Habsburg uralom (1686–1848): újjáépítés és betelepítés, az ország soknemzetiségűvé vált. 1703–1711: II. Rákóczi Ferenc vezette szabadságharc a Habsburgok ellen.","Habsburg rule (1686–1848): rebuilding and resettlement; the country became multi-ethnic. 1703–1711: war of independence led by Ferenc Rákóczi II against the Habsburgs.","Habsburg yönetimi (1686–1848): yeniden inşa ve iskân; ülke çok uluslu oldu. 1703–1711: II. Rákóczi Ferenc önderliğinde Habsburg karşıtı ayaklanma."],["Reformkor (1825–1848): a modern magyar nemzet születése, a magyar nyelv és kultúra megerősödése. Széchenyi István („a legnagyobb magyar”) megalapította a Magyar Tudományos Akadémiát és felépíttette a Lánchidat. További alakok: Kossuth Lajos, Batthyány Lajos, Deák Ferenc.","Reform Era (1825–1848): birth of the modern nation, strengthening of language and culture. István Széchenyi (“the greatest Hungarian”) founded the Academy of Sciences and had the Chain Bridge built. Others: Kossuth, Batthyány, Deák.","Reform Çağı (1825–1848): modern ulusun doğuşu, dil ve kültürün güçlenmesi. Széchenyi István (“en büyük Macar”) Bilimler Akademisi’ni kurdu, Zincirli Köprü’yü yaptırdı. Diğerleri: Kossuth, Batthyány, Deák."],["1848. március 15.: a márciusi ifjak a Pilvax kávéházban gyűltek össze, kinyomtatták a 12 pontot és kiszabadították Táncsics Mihályt (Petőfi Sándor, Jókai Mór, Vasvári Pál). Jelkép: a piros-fehér-zöld kokárda. 1848. április 11.: megalakult az első felelős magyar kormány, miniszterelnöke Batthyány Lajos.","15 March 1848: the young radicals met at the Pilvax café, printed the 12 Points and freed Mihály Táncsics (Petőfi, Jókai, Vasvári). Symbol: the red-white-green cockade. 11 April 1848: first responsible government, PM Lajos Batthyány.","15 Mart 1848: Mart gençleri Pilvax kahvehanesinde toplandı, 12 maddeyi bastı ve Táncsics Mihály’ı kurtardı (Petőfi, Jókai, Vasvári). Sembol: kırmızı-beyaz-yeşil kokart. 11 Nisan 1848: ilk sorumlu hükümet, başbakan Batthyány Lajos."],["A szabadságharcot a Habsburgok az orosz cári sereg segítségével verték le. 1849. augusztus 13.: Görgei Artúr Világosnál letette a fegyvert. 1849. október 6.: Aradon kivégezték a 13 honvédtisztet (aradi vértanúk), Pesten Batthyány Lajost.","The Habsburgs crushed the war with the help of the Russian tsar’s army. 13 August 1849: Görgei surrendered at Világos. 6 October 1849: 13 officers executed at Arad (Martyrs of Arad), Batthyány in Pest.","Habsburglar ayaklanmayı Rus Çarı’nın ordusuyla bastırdı. 13 Ağustos 1849: Görgei Világos’ta teslim oldu. 6 Ekim 1849: Arad’da 13 subay (Arad şehitleri), Peşte’de Batthyány idam edildi."],["Kiegyezés (1867): Deák Ferenc, „a haza bölcse” kulcsszerepével létrejött az Osztrák–Magyar Monarchia. 1867–1914: Magyarország aranykora, gyors gazdasági fejlődés (pl. Országház, 1885–1904).","The Compromise (1867): with Ferenc Deák, “the sage of the nation”, the Austro-Hungarian Monarchy was created. 1867–1914: Hungary’s golden age (e.g. Parliament building, 1885–1904).","Uzlaşma (1867): “vatanın bilgesi” Deák Ferenc’in kilit rolüyle Avusturya-Macaristan kuruldu. 1867–1914: altın çağ (ör. Parlamento binası, 1885–1904)."],["I. világháború (1914–1918): 1914. június 28-án Szarajevóban meggyilkolták Ferenc Ferdinánd trónörököst; július 28-án a Monarchia hadat üzent Szerbiának. A Monarchia a központi hatalmak oldalán harcolt; az antant győzött.","WWI (1914–1918): heir Franz Ferdinand was killed in Sarajevo on 28 June 1914; the Monarchy declared war on Serbia on 28 July. It fought with the Central Powers; the Entente won.","I. Dünya Savaşı (1914–1918): 28 Haziran 1914’te veliaht Franz Ferdinand Saraybosna’da öldürüldü; 28 Temmuz’da Sırbistan’a savaş ilan edildi. Monarşi İttifak tarafındaydı; İtilaf kazandı."],["Trianoni békeszerződés (1920. június 4.): Magyarország elveszítette területének kb. kétharmadát, népessége 18,2 millióról 7,6 millióra csökkent, kb. 3,3 millió magyar a határokon kívül rekedt. Cél a határok revíziója lett (Horthy Miklós, Bethlen István, Teleki Pál).","Treaty of Trianon (4 June 1920): Hungary lost about two-thirds of its territory; population fell from 18.2 to 7.6 million; ~3.3 million Hungarians ended up outside the borders. Revision became the goal (Horthy, Bethlen, Teleki).","Trianon Antlaşması (4 Haziran 1920): Macaristan topraklarının yaklaşık üçte ikisini kaybetti; nüfus 18,2’den 7,6 milyona düştü; ~3,3 milyon Macar sınır dışında kaldı. Hedef sınırların revizyonu oldu (Horthy, Bethlen, Teleki)."],["II. világháború: Magyarország 1941-ben lépett hadba a tengelyhatalmak oldalán. 1943 januárjában a 2. magyar hadsereg nagy része elpusztult a Donnál. 1944. március 19-én Németország megszállta az országot; a holokausztnak 500–600 ezer magyar áldozata volt.","WWII: Hungary entered the war in 1941 on the Axis side. In January 1943 most of the 2nd Hungarian Army was destroyed at the Don. On 19 March 1944 Germany occupied Hungary; 500–600 thousand Hungarian victims of the Holocaust.","II. Dünya Savaşı: Macaristan 1941’de Mihver tarafında savaşa girdi. Ocak 1943’te 2. Macar ordusunun çoğu Don’da yok oldu. 19 Mart 1944’te Almanya ülkeyi işgal etti; Holokost’un 500–600 bin Macar kurbanı oldu."],["1956: a háború után maradt szovjet hadsereg mellett a kommunisták egypártrendszert építettek ki (Rákosi Mátyás). Október 23-án diáktüntetéssel kezdődött a forradalom; a kormány élén Nagy Imre állt (Corvin köz, Széna tér). Jelkép: a lyukas zászló. November 4-én a szovjet csapatok leverték; Kádár János került hatalomra, Nagy Imrét kivégezték.","1956: with Soviet troops still present, the communists built a one-party state (Rákosi). The revolution began with a student demonstration on 23 October; Imre Nagy led the government (Corvin köz, Széna tér). Symbol: the flag with a hole. On 4 November Soviet troops crushed it; János Kádár took power, Nagy was executed.","1956: Sovyet ordusu ülkede kalırken komünistler tek parti rejimi kurdu (Rákosi). Devrim 23 Ekim’de öğrenci gösterisiyle başladı; hükümetin başında Nagy Imre vardı (Corvin köz, Széna tér). Sembol: delikli bayrak. 4 Kasım’da Sovyetler bastırdı; Kádár János iktidara geldi, Nagy idam edildi."],["Rendszerváltás (1989–1990): békés átmenet az egypártrendszerből a többpárti parlamentáris demokráciába. 1990 tavaszán szabad választások; Antall József vezetésével kormány alakult, köztársasági elnök Göncz Árpád lett. A szovjet csapatok 1991-ben hagyták el az országot.","Change of regime (1989–1990): peaceful transition to multi-party parliamentary democracy. Free elections in spring 1990; József Antall formed the government, Árpád Göncz became president. Soviet troops left in 1991.","Rejim değişikliği (1989–1990): çok partili parlamenter demokrasiye barışçıl geçiş. 1990 baharında serbest seçimler; hükümeti Antall József kurdu, cumhurbaşkanı Göncz Árpád oldu. Sovyet birlikleri 1991’de ayrıldı."]],"tr":"Macaristan tarihi"},{"id":3,"hu":"Irodalom és zenetörténet","en":"Literature and music","ic":"🎼","notes":[["A magyar népzene kiemelkedő; a népdalokat az 1800-as évektől gyűjtötték. A népzenekutatás két leghíresebb alakja Bartók Béla és Kodály Zoltán.","Hungarian folk music is outstanding; folk songs were collected from the 1800s. The two best-known researchers: Béla Bartók and Zoltán Kodály.","Macar halk müziği öne çıkar; halk şarkıları 1800’lerden itibaren derlendi. En ünlü iki araştırmacı: Bartók Béla ve Kodály Zoltán."],["Zeneszerzők és műveik: Erkel Ferenc – Bánk bán (opera); Liszt Ferenc – Magyar rapszódiák; Bartók Béla – A kékszakállú herceg vára; Kodály Zoltán – Háry János (daljáték).","Composers and works: Erkel – Bánk bán (opera); Liszt – Hungarian Rhapsodies; Bartók – Bluebeard’s Castle; Kodály – Háry János (singspiel).","Besteciler ve eserleri: Erkel – Bánk bán (opera); Liszt – Macar Rapsodileri; Bartók – Mavi Sakal’ın Şatosu; Kodály – Háry János (şarkılı oyun)."],["Irodalmi korszakok: reneszánsz – Janus Pannonius (Pannónia dicsérete), Balassi Bálint; barokk – Zrínyi Miklós (Szigeti veszedelem); felvilágosodás – Csokonai Vitéz Mihály, Batsányi János; klasszicizmus – Kazinczy Ferenc (nyelvújítás), Berzsenyi Dániel.","Literary periods: Renaissance – Janus Pannonius, Bálint Balassi; Baroque – Miklós Zrínyi (The Peril of Sziget); Enlightenment – Csokonai, Batsányi; Classicism – Kazinczy (language reform), Berzsenyi.","Edebî dönemler: Rönesans – Janus Pannonius, Balassi Bálint; Barok – Zrínyi Miklós (Sziget Felaketi); Aydınlanma – Csokonai, Batsányi; Klasisizm – Kazinczy (dil reformu), Berzsenyi."],["A romantika: Kölcsey Ferenc – Himnusz; Vörösmarty Mihály – Szózat; Petőfi Sándor – Nemzeti dal; Jókai Mór – A kőszívű ember fiai; Arany János – A walesi bárdok; Katona József – Bánk bán (dráma); Madách Imre – Az ember tragédiája.","Romanticism: Kölcsey – Himnusz; Vörösmarty – Szózat; Petőfi – National Song; Jókai – The Baron’s Sons; Arany – The Bards of Wales; Katona – Bánk bán (drama); Madách – The Tragedy of Man.","Romantizm: Kölcsey – Himnusz; Vörösmarty – Szózat; Petőfi – Ulusal Şarkı; Jókai – Taş Kalpli Adamın Oğulları; Arany – Galli Ozanlar; Katona – Bánk bán (dram); Madách – İnsanın Trajedisi."],["A 20. század: Ady Endre; Móricz Zsigmond – Rokonok; Kosztolányi Dezső – Édes Anna; Karinthy Frigyes – Így írtok ti; József Attila – Tiszta szívvel; Radnóti Miklós – Nem tudhatom…; Márai Sándor – Egy polgár vallomásai.","20th century: Ady; Móricz – Relations; Kosztolányi – Anna Édes; Karinthy – That’s How You Write; Attila József – With a Pure Heart; Radnóti – I Cannot Know…; Márai – Confessions of a Bourgeois.","20. yüzyıl: Ady; Móricz – Akrabalar; Kosztolányi – Édes Anna; Karinthy – Így írtok ti; József Attila – Temiz Yürekle; Radnóti – Nem tudhatom…; Márai – Bir Burjuvanın İtirafları."],["Európai irodalom és zene: Shakespeare (angol) – Rómeó és Júlia; Voltaire – Candide; Goethe – Faust; Mozart – A varázsfuvola; Csajkovszkij – A hattyúk tava. Az EU himnusza Beethoven IX. szimfóniájának 4. tétele, az Örömóda (Schiller verse).","European literature and music: Shakespeare (English) – Romeo and Juliet; Voltaire – Candide; Goethe – Faust; Mozart – The Magic Flute; Tchaikovsky – Swan Lake. The EU anthem is the 4th movement of Beethoven’s 9th, the Ode to Joy (Schiller).","Avrupa edebiyatı ve müziği: Shakespeare (İngiliz) – Romeo ve Juliet; Voltaire – Candide; Goethe – Faust; Mozart – Sihirli Flüt; Çaykovski – Kuğu Gölü. AB marşı: Beethoven’ın 9. Senfonisi’nin 4. bölümü, Neşeye Övgü (Schiller)."]],"tr":"Edebiyat ve müzik tarihi"},{"id":4,"hu":"Alaptörvény és állami intézmények","en":"Fundamental Law and state institutions","ic":"⚖️","notes":[["Az Alaptörvény Magyarország alkotmánya, a legmagasabb jogi erővel bíró norma, a jogrend alapja. Az Országgyűlés 2011. április 18-án fogadta el, 2012. január 1-jén lépett hatályba.","The Fundamental Law is Hungary’s constitution, the highest legal norm. Parliament adopted it on 18 April 2011; it came into force on 1 January 2012.","Temel Yasa Macaristan’ın anayasasıdır, en yüksek hukuki normdur. Parlamento 18 Nisan 2011’de kabul etti; 1 Ocak 2012’de yürürlüğe girdi."],["Az Országgyűlés a legfőbb népképviseleti szerv: 199 képviselő, 4 évre választva. Feladatai: megalkotja és módosítja az Alaptörvényt, törvényeket alkot, elfogadja a központi költségvetést, megválasztja a miniszterelnököt (és a köztársasági elnököt).","Parliament is the supreme representative body: 199 members, elected for 4 years. It makes and amends the Fundamental Law, passes laws, adopts the central budget and elects the prime minister (and the president).","Parlamento en yüksek temsil organıdır: 199 üye, 4 yıllığına. Temel Yasa’yı yapar ve değiştirir, yasa çıkarır, merkezi bütçeyi kabul eder, başbakanı (ve cumhurbaşkanını) seçer."],["A végrehajtó hatalmat a Kormány és a közigazgatás alkotja. Tagjai a miniszterelnök és a miniszterek. Feladatai: irányítja a közigazgatást, jogszabályokat alkot, működteti az állami ellátórendszereket (honvédelem, oktatás, egészségügy). Az Európai Tanácsban a miniszterelnök képviseli az országot.","Executive power: the Government and public administration – the prime minister and ministers. It runs administration, makes regulations and operates state services. The PM represents Hungary in the European Council.","Yürütme erki: Hükümet ve kamu yönetimi – başbakan ve bakanlar. Kamu yönetimini yürütür, düzenleme yapar, devlet hizmetlerini işletir. Avrupa Konseyi’nde ülkeyi başbakan temsil eder."],["Miniszterelnök: Magyar Péter (2026. május 9. óta). A 2026 előtti anyagokban még Orbán Viktor szerepel.","Prime minister: Péter Magyar (since 9 May 2026). Materials from before 2026 still name Viktor Orbán.","Başbakan: Magyar Péter (9 Mayıs 2026’dan beri). 2026 öncesi materyallerde hâlâ Orbán Viktor yazar."],["Az államfő a köztársasági elnök: kifejezi a nemzet egységét és őrködik az államszervezet demokratikus működése felett. Az Országgyűlés titkos szavazással választja 5 évre, legfeljebb egyszer választható újra. A Honvédség főparancsnoka, összehívja az Országgyűlés alakuló ülését, meghatározott esetekben feloszlathatja az Országgyűlést.","The head of state is the President: expresses national unity and guards democratic operation. Elected by Parliament by secret ballot for 5 years, re-electable once. Commander-in-chief; convenes Parliament’s inaugural session; can dissolve Parliament in certain cases.","Devlet başkanı cumhurbaşkanıdır: ulusun birliğini ifade eder, demokratik işleyişi gözetir. Parlamento gizli oyla 5 yıllığına seçer, bir kez yeniden seçilebilir. Başkomutandır; Parlamento’nun kuruluş oturumunu toplar; bazı durumlarda Parlamento’yu feshedebilir."],["Köztársasági elnök: Baka András (2026. augusztus 19. óta). Elődje Sulyok Tamás volt, akinek megbízatása 2026 júliusában szűnt meg – a régebbi anyagokban még az ő neve szerepel.","President: András Baka (since 19 August 2026). His predecessor was Tamás Sulyok, whose term ended in July 2026 – older materials still name him.","Cumhurbaşkanı: Baka András (19 Ağustos 2026’dan beri). Selefi Sulyok Tamás’ın görevi Temmuz 2026’da sona erdi – eski materyallerde hâlâ onun adı geçer."],["A bíróságok függetlenek; a minisztériumok nem részei az igazságszolgáltatásnak. Nem minisztérium például a Kúria és az Alkotmánybíróság.","Courts are independent; ministries are not part of the judiciary. The Curia and the Constitutional Court are not ministries.","Mahkemeler bağımsızdır; bakanlıklar yargının parçası değildir. Kúria ve Anayasa Mahkemesi bakanlık değildir."]],"tr":"Temel Yasa ve devlet kurumları"},{"id":5,"hu":"Alapvető jogok és kötelezettségek","en":"Fundamental rights and duties","ic":"🕊️","notes":[["Az emberi jogok mérföldkövei: angol Magna Charta Libertatum (1215), magyar Aranybulla (1222), francia Emberi és Polgári Jogok Nyilatkozata (1789), Emberi Jogok Európai Egyezménye (1950).","Milestones of human rights: English Magna Carta (1215), Hungarian Golden Bull (1222), French Declaration of the Rights of Man and of the Citizen (1789), European Convention on Human Rights (1950).","İnsan haklarının dönüm noktaları: İngiliz Magna Carta (1215), Macar Altın Bulla (1222), Fransız İnsan ve Yurttaş Hakları Bildirgesi (1789), Avrupa İnsan Hakları Sözleşmesi (1950)."],["Jogegyenlőség: az állam minden polgárát egyenlő jogok illetik meg, a törvény előtt mindenki egyenlő. A polgári társadalmak a 17–18. században küzdöttek érte.","Equality of rights: every citizen has equal rights and everyone is equal before the law. Civil societies fought for it in the 17th–18th centuries.","Hak eşitliği: her vatandaş eşit haklara sahiptir, yasa önünde herkes eşittir. Sivil toplumlar bunun için 17.–18. yüzyıllarda mücadele etti."],["Első generációs jogok: élet, személyi szabadság, egyesülés és gyülekezés, lelkiismeret és vallás, szólás és sajtó.","First-generation rights: life, personal liberty, association and assembly, conscience and religion, speech and press.","Birinci kuşak haklar: yaşam, kişi özgürlüğü, örgütlenme ve toplanma, vicdan ve din, ifade ve basın."],["Második generációs jogok: munka, sztrájk, oktatás, szociális biztonság.","Second-generation rights: work, strike, education, social security.","İkinci kuşak haklar: çalışma, grev, eğitim, sosyal güvenlik."],["Harmadik generációs jogok: egészséges környezet, gyermekek, betegek és fogyatékkal élők jogai.","Third-generation rights: healthy environment, rights of children, patients and people with disabilities.","Üçüncü kuşak haklar: sağlıklı çevre, çocuk, hasta ve engelli hakları."],["Az Alaptörvényben biztosított alapvető jogok: törvény előtti egyenlőség; élethez és emberi méltósághoz való jog; tisztességes eljárás; gondolat-, lelkiismereti és vallásszabadság; véleménynyilvánítás szabadsága; gyülekezési szabadság; tulajdonjog és öröklés; személyes adatok védelme.","Fundamental rights in the Fundamental Law: equality before the law; life and human dignity; fair trial; freedom of thought, conscience and religion; freedom of expression; assembly; property and inheritance; protection of personal data.","Temel Yasa’daki temel haklar: yasa önünde eşitlik; yaşam ve insan onuru; adil yargılanma; düşünce, vicdan ve din özgürlüğü; ifade özgürlüğü; toplanma; mülkiyet ve miras; kişisel verilerin korunması."],["A halálbüntetést 1990-ben az Alkotmánybíróság alkotmányellenesnek nyilvánította, azóta nincs halálbüntetés.","In 1990 the Constitutional Court declared the death penalty unconstitutional; there has been none since.","1990’da Anayasa Mahkemesi idam cezasını anayasaya aykırı ilan etti; o zamandan beri yoktur."]],"tr":"Temel haklar ve yükümlülükler"},{"id":6,"hu":"Európa és Magyarország a mindennapokban","en":"Hungary and Europe in everyday life","ic":"🗺️","notes":[["Magyarország: államforma köztársaság; terület kb. 93 ezer km²; népesség kb. 9,6 millió; főváros Budapest; pénznem forint; hivatalos nyelv magyar; 19 vármegye.","Hungary: republic; area about 93,000 km²; population about 9.6 million; capital Budapest; currency forint; official language Hungarian; 19 counties.","Macaristan: cumhuriyet; yüzölçümü ~93 bin km²; nüfus ~9,6 milyon; başkent Budapeşte; para birimi forint; resmî dil Macarca; 19 il."],["Legnagyobb tavak: Balaton, Fertő tó, Velencei-tó. Legnagyobb folyók: Duna, Tisza, Dráva, Rába.","Largest lakes: Balaton, Lake Fertő, Lake Velence. Largest rivers: Danube, Tisza, Drava, Rába.","En büyük göller: Balaton, Fertő, Velence. En büyük nehirler: Tuna, Tisza, Drava, Rába."],["Hét szomszédos ország: Ausztria, Szlovákia, Ukrajna, Románia, Szerbia, Horvátország, Szlovénia.","Seven neighbours: Austria, Slovakia, Ukraine, Romania, Serbia, Croatia, Slovenia.","Yedi komşu: Avusturya, Slovakya, Ukrayna, Romanya, Sırbistan, Hırvatistan, Slovenya."],["13 elismert nemzetiség: bolgár, görög, horvát, lengyel, német, örmény, roma, román, ruszin, szerb, szlovák, szlovén, ukrán.","13 recognised nationalities: Bulgarian, Greek, Croatian, Polish, German, Armenian, Roma, Romanian, Rusyn, Serbian, Slovak, Slovene, Ukrainian.","13 tanınmış azınlık: Bulgar, Yunan, Hırvat, Polonyalı, Alman, Ermeni, Roman, Rumen, Rusin, Sırp, Slovak, Sloven, Ukraynalı."],["Budapest 1873. november 17-én jött létre Pest, Buda és Óbuda egyesítésével; 1994 óta 23 kerülete van. Nevezetességek: Budavári Palota, Halászbástya, Hősök tere, Országház, Szent István-bazilika, Széchenyi Lánchíd, Magyar Állami Operaház, Mátyás-templom.","Budapest was created on 17 November 1873 by uniting Pest, Buda and Óbuda; it has had 23 districts since 1994. Sights: Buda Castle, Fishermen’s Bastion, Heroes’ Square, Parliament, St Stephen’s Basilica, Chain Bridge, State Opera, Matthias Church.","Budapeşte 17 Kasım 1873’te Pest, Buda ve Óbuda’nın birleşmesiyle kuruldu; 1994’ten beri 23 ilçesi var. Önemli yerler: Buda Sarayı, Balıkçı Tabyası, Kahramanlar Meydanı, Parlamento, Aziz István Bazilikası, Zincirli Köprü, Devlet Operası, Mátyás Kilisesi."],["Hungarikumok – ételek: gulyásleves, halászlé, dobostorta, Pick téliszalámi; italok: tokaji aszú, egri bikavér, pálinka; kultúra: mohácsi busójárás, Hollókő, Pannonhalmi Bencés Főapátság; állatok: szürke marha, puli, komondor, kuvasz, vizsla; népművészet: halasi csipke, matyó népművészet, Zsolnay-porcelán. Fűszerpaprika: Kalocsa és Szeged.","Hungarikums – food: goulash soup, fish soup, Dobos cake, Pick winter salami; drinks: Tokaji aszú, Egri Bikavér, pálinka; culture: Busójárás in Mohács, Hollókő, Pannonhalma Abbey; animals: grey cattle, puli, komondor, kuvasz, vizsla; folk art: Halas lace, Matyó embroidery, Zsolnay porcelain. Paprika: Kalocsa and Szeged.","Hungarikumlar – yemek: gulaş çorbası, balık çorbası, Dobos pastası, Pick salamı; içecek: Tokaji aszú, Egri Bikavér, pálinka; kültür: Mohaç Busójárás, Hollókő, Pannonhalma Manastırı; hayvan: gri sığır, puli, komondor, kuvasz, vizsla; halk sanatı: Halas danteli, Matyó işlemesi, Zsolnay porseleni. Paprika: Kalocsa ve Szeged."],["Legjelentősebb felekezetek: katolikus, református, evangélikus. Keresztény ünnepek: karácsony (dec. 24–26., Jézus születése), húsvét (Jézus feltámadása). Augusztus 20-án Szent Jobb körmenet és tűzijáték.","Main denominations: Catholic, Reformed, Lutheran. Christian holidays: Christmas (24–26 Dec, birth of Jesus), Easter (resurrection). On 20 August: Holy Right procession and fireworks.","Başlıca mezhepler: Katolik, Reformcu, Lüteriyen. Hristiyan bayramları: Noel (24–26 Aralık, İsa’nın doğumu), Paskalya (diriliş). 20 Ağustos’ta Kutsal Sağ El alayı ve havai fişek."],["Európai Unió: Magyarország 2004. május 1-jén csatlakozott, 2007 óta schengeni tag (NATO-tag 1999 óta). Az EU-nak 27 tagállama és kb. 450 millió polgára van, központja Brüsszel. Fő intézmények: Európai Bizottság, Tanács, Európai Parlament, Európai Tanács. Magyarország 21 képviselőt küld az Európai Parlamentbe.","EU: Hungary joined on 1 May 2004, Schengen since 2007 (NATO since 1999). The EU has 27 member states and about 450 million citizens; centre: Brussels. Main institutions: Commission, Council, Parliament, European Council. Hungary has 21 MEPs.","AB: Macaristan 1 Mayıs 2004’te katıldı, 2007’den beri Schengen’de (1999’dan beri NATO). AB’nin 27 üyesi ve ~450 milyon vatandaşı var; merkezi Brüksel. Ana kurumlar: Komisyon, Konsey, Avrupa Parlamentosu, Avrupa Konseyi. Macaristan’ın 21 AP üyesi var."]],"tr":"Gündelik hayatta Macaristan ve Avrupa"}];

function qItem(q,opt={}){const hl=s=>opt.hl?mark(s,opt.hl):esc(s);

function mark(s,term){const n=norm(s),i=n.indexOf(term);if(i<0)return esc(s);return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+term.length))+'</mark>'+esc(s.slice(i+term.length))}

/* MC engine */
function mcFor(q){return{q,opts:shuffle([mcAns(q),...q.w.slice(0,3)])}}
function fbHTML(q,ok){const extra=q.a!==mcAns(q)?ansHTML(q.a):'';return `<div class="fb"><b style="color:var(${ok?'--ok':'--bad'})">${ok?t('correct'):t('wrongIs')+' '+esc(mcAns(q))}</b>${extra||q.note?`<div class="full">${extra}${q.note?IC('info')+' '+esc(q.note):''}</div>`:''}<div class="full en">${esc(ha(q))}</div></div>`}
function quizBox(box,cur,o){const q=cur.q;
  box.innerHTML=`${o.prog!=null?`<div class="qprog"><i style="width:${o.prog}%"></i></div>`:''}<div class="top"><span>${o.left}</span><span class="row" style="gap:8px">${o.right||''} ${badge(q)}</span></div><h2>${esc(mcText(q))}</h2><p class="en" style="margin:0">${esc(hq(q))}</p><div class="opts">${cur.opts.map((x,i)=>`<button class="opt" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span>${esc(x)}</span></button>`).join('')}</div><div class="fbz"></div>`;
  const show=(pick,fresh)=>{const ok=pick===mcAns(q);box.querySelectorAll('.opt').forEach(x=>{const v=cur.opts[+x.dataset.i];x.disabled=true;if(v===mcAns(q))x.classList.add('ok');if(v===pick&&!ok)x.classList.add('bad')});
    if(fresh){cur.pick=pick;o.onAns&&o.onAns(ok)}
    box.querySelector('.fbz').innerHTML=(o.feedback!==false?fbHTML(q,ok):'')+`<div class="row" style="margin-top:14px"><button class="btn primary sm nx">${o.nextLabel}</button></div>`;const nx=box.querySelector('.nx');nx.onclick=o.onNext;if(fresh)nx.focus({preventScroll:true})};
  if(cur.pick!=null)show(cur.pick,false);else box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>show(cur.opts[+b.dataset.i],true));
}
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const k='abcd1234'.indexOf(e.key.toLowerCase());if(k<0)return;const b=document.querySelectorAll('.quiz .opt:not([disabled])')[k%4];if(b)b.click()});

/* flashcards (state kept per key so a language switch resumes) */
const FC={};
function flash(box,items,key){let st=FC[key];if(!st||st.n!==items.length){st=FC[key]={n:items.length,deck:items.map((_,i)=>i),i:0}}
  function draw(){const deck=st.deck;if(st.i>=deck.length){const k=items.filter(x=>x.isKnown()).length;box.innerHTML=`<div class="quiz" style="margin:0 auto;text-align:center"><h2>${t('done')}</h2><p>${t('doneP')(k,items.length)}</p><div class="row" style="justify-content:center"><button class="btn primary sm" id="fr">${t('restart')}</button></div></div>`;$('fr').onclick=()=>{const rest=items.map((_,i)=>i).filter(i=>!items[i].isKnown());st.deck=shuffle(rest.length?rest:items.map((_,i)=>i));st.i=0;draw()};return}
    const it=items[deck[st.i]];box.innerHTML=`<div class="fc"><div class="count">${st.i+1} / ${deck.length}</div><div class="card" tabindex="0" role="button" aria-label="${t('tapFlip')}"><div class="face"><b>${esc(it.front)}</b>${it.sub?`<small class="en">${esc(it.sub)}</small>`:''}<small>${t('tapFlip')}</small></div><div class="face back"><div class="ansl">${it.back}</div></div></div><div class="fcbar"><button class="btn sm" id="fa">${t('again')}</button><button class="btn primary sm" id="fg">${t('got')}</button><button class="btn sm" id="fs" title="${t('shuffle')}" aria-label="${t('shuffle')}">${IC('shuffle')}</button></div></div>`;
    const c=box.querySelector('.card');const flip=()=>c.classList.toggle('flip');c.onclick=flip;c.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();flip()}};
    $('fa').onclick=()=>{it.setKnown(false);st.deck.push(deck[st.i]);st.i++;draw()};$('fg').onclick=()=>{it.setKnown(true);st.i++;draw()};$('fs').onclick=()=>{st.deck=shuffle(st.deck.slice(st.i));st.i=0;draw()}}
  draw()}
const qCards=qs=>qs.map(q=>({front:q.q,sub:hq(q),back:ansHTML(q.a)+`<div class="en" style="font-weight:400;font-size:15px;margin-top:6px">${esc(ha(q))}</div>`,isKnown:()=>learned.has(q.id),setKnown:v=>{v?learned.add(q.id):learned.delete(q.id);S.set('learned',[...learned])}}));
const wKey=(c,w)=>c+':'+w[0];
const wCards=(c,ws)=>ws.map(w=>({front:w[0],back:`<b style="font-family:var(--display);font-size:26px">${esc(wordH(w))}</b>`,isKnown:()=>known.has(wKey(c,w)),setKnown:v=>{v?known.add(wKey(c,w)):known.delete(wKey(c,w));S.set('known',[...known])}}));
const WQ={};
function wordQuiz(box,c,ws,reset){const key='w'+c;let st=WQ[key];
  if(reset||!st){const order=shuffle(ws.map((_,i)=>i));st=WQ[key]={order,opts:order.map(i=>shuffle([i,...shuffle(ws.map((_,j)=>j).filter(j=>j!==i)).slice(0,3)])),i:0,r:0,pick:null}}
  const W=j=>wordH(ws[j]);
  function draw(){const n=st.order.length;if(st.i>=n){box.innerHTML=`<div class="quiz"><div class="score">${st.r}/${n}</div><div class="row"><button class="btn primary sm" id="wq">${t('restart')}</button></div></div>`;$('wq').onclick=()=>wordQuiz(box,c,ws,true);return}
    const wi=st.order[st.i],opts=st.opts[st.i];
    box.innerHTML=`<div class="quiz"><div class="qprog"><i style="width:${st.i/n*100}%"></i></div><div class="top"><span>${st.i+1} / ${n}</span><span>${t('scoreLine')(st.r,st.i)}</span></div><h2>${esc(ws[wi][0])}</h2><div class="opts">${opts.map((o,j)=>`<button class="opt" data-o="${o}"><span class="k">${'ABCD'[j]}</span><span>${esc(W(o))}</span></button>`).join('')}</div><div class="fbz"></div></div>`;
    const show=(pk,fresh)=>{box.querySelectorAll('.opt').forEach(x=>{const v=+x.dataset.o;x.disabled=true;if(v===wi)x.classList.add('ok');if(v===pk&&pk!==wi)x.classList.add('bad')});
      if(fresh){st.pick=pk;if(pk===wi){st.r++;known.add(wKey(c,ws[wi]));S.set('known',[...known])}}
      box.querySelector('.fbz').innerHTML=`<div class="row" style="margin-top:14px"><button class="btn primary sm nx">${t('nextQ')}</button></div>`;const b=box.querySelector('.nx');b.onclick=()=>{st.i++;st.pick=null;draw()};if(fresh)b.focus({preventScroll:true})};

function vocabMode(seg,box,c,ws){const set=m=>{VM[c]=m;seg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===m));

function buyBox(){if(WAITING)return `<div class="tip" style="margin-top:14px">${tx('Fizetés ellenőrzése… Ez általában néhány másodperc.','Confirming your payment… This usually takes a few seconds.','Ödemen doğrulanıyor… Bu genelde birkaç saniye sürer.')}</div>`;
  return `<button class="btn primary buybig" data-buy>${tx('Megveszem','Buy full access','Tam erişimi satın al')} – ${SHOP.price}</button>
  <p id="buyMsg" class="fine">${IC('lock')} ${tx('Biztonságos fizetés a Lemon Squeezy oldalán – a kártyaadataid nem jutnak el hozzánk. A címet csak a számla miatt kérik.','Secure payment on Lemon Squeezy – your card details never reach us. The address is only needed for the invoice.','Güvenli ödeme Lemon Squeezy’de – kart bilgilerin bize ulaşmaz. Adres sadece fatura için isteniyor.')}</p>
  ${USER?`<button class="btn sm" id="recheck" style="margin-top:6px">${tx('Már fizettem – ellenőrzés','I’ve paid – check again','Ödedim – tekrar kontrol et')}</button>`:''}`}
function incList(){return [tx('Mind a 6 lecke, ábrákkal és idővonallal','All 6 lessons, with illustrations and a timeline','6 dersin tamamı, görseller ve zaman çizelgesiyle'),tx(`Mind a ${META.total} kérdés gyakorlása (${META.reported} vizsgán szerepelt)`,`Practice with all ${META.total} questions (${META.reported} reported from real exams)`,`${META.total} sorunun hepsiyle sınırsız alıştırma (${META.reported}’si sınavda çıkmış)`),tx('Próbavizsga az igazi formátumban, írásbeli kérdésekkel','Mock exam in the real format, with written questions','Gerçek formatta, yazılı sorulu deneme sınavı'),tx('Teljes szókincs, keresés, és a haladásod minden eszközön','Full vocabulary, search, and your progress on every device','Tüm kelimeler, arama ve her cihazda kayıtlı ilerleme')]}
function pUnlock(from){setTimeout(acctWire);
  if(paid())return `<div class="wrap narrow">${crumb(t('unlock'))}<div class="ph"><h1>${t('unlock')}</h1><p class="sub">${tx('A teljes hozzáférés aktív.','Full access is active.','Tam erişimin açık.')}</p></div><div class="row"><a class="btn primary" href="#l2">${tx('Tovább a 2. leckéhez','Go to lesson 2','2. derse geç')}</a><a class="btn" href="#mock">${t('mock')}</a></div></div>`;
  const why=from==='practice'?tx('Az ingyenes gyakorlást már felhasználtad. A korlátlan gyakorláshoz teljes hozzáférés kell.','You’ve used your free practice session. Unlimited practice is part of full access.','Ücretsiz alıştırma hakkını kullandın. Sınırsız alıştırma tam erişime dahil.'):from&&from!=='unlock'?tx('Ez a rész a teljes hozzáférés része.','This part is included in full access.','Bu bölüm tam erişime dahil.'):tx('Az 1. lecke és a vizsgatájékoztató ingyenes. A többi egyszeri díjért elérhető.','Lesson 1 and the exam information are free. Everything else is a one-time payment.','1. ders ve sınav bilgileri ücretsiz. Gerisi tek seferlik ödemeyle açılır.');
  return `<div class="wrap narrow">${crumb(t('unlock'))}<div class="ph"><h1>${t('unlock')}</h1><p class="sub">${why}</p></div>
  <div class="quiz" style="margin-bottom:16px"><h2>${tx('Mit kapsz?','What you get','Neler dahil?')}</h2><ul style="padding-left:20px;margin:10px 0 16px">${incList().map(i=>`<li style="margin:4px 0">${i}</li>`).join('')}</ul>
   <div class="row" style="align-items:baseline;gap:14px"><span class="score" style="font-size:32px">${SHOP.price}</span><span style="color:var(--muted)">${tx('egyszeri díj, előfizetés nélkül','one-time, no subscription','tek seferlik, abonelik yok')}</span></div>
   ${buyBox()}${USER?'':steps()}</div>
  ${!AUTHBUSY&&!USER?`<h2 class="sh" style="font-size:18px;margin:22px 0 10px">${tx('Már fizettél? Lépj be:','Already paid? Sign in:','Zaten ödedin mi? Giriş yap:')}</h2>`+loginBox():''}</div>`}
function pAccount(){setTimeout(acctWire);
  const head=`<div class="wrap narrow">${crumb(t('account'))}<div class="ph"><h1>${t('account')}</h1></div>`;
  if(!sb)return head+`<div class="tip">${tx('A fiókrendszer most nem érhető el. Próbáld később.','The account system is not available right now. Please try later.','Hesap sistemine şu an ulaşılamıyor. Daha sonra tekrar dene.')}</div></div>`;
  if(AUTHBUSY)return head+`<p style="color:var(--muted)">…</p></div>`;
  if(!USER)return head+(payRecent()?`<div class="paidnote"><b>${tx('Köszönjük, a fizetés megérkezett!','Thank you, your payment went through!','Teşekkürler, ödemen alındı!')}</b><br>${tx('Most írd be azt az e-mail címet, amellyel fizettél. Küldünk egy linket – rákattintasz, és a teljes hozzáférés aktív.','Now enter the e-mail address you paid with. We send you a link – click it and full access is active.','Şimdi ödeme yaptığın e-posta adresini yaz. Sana bir link göndereceğiz – tıkla, tam erişimin açılsın.')}</div>`:'')+loginBox()+`</div>`;
  return head+`<div class="quiz"><p style="margin:0;color:var(--muted)">${tx('Bejelentkezve','Signed in as','Giriş yapan')}</p><p style="margin:2px 0 14px;font-weight:700;word-break:break-all">${esc(USER.email||'')}</p>
   <p style="color:var(--muted)">${tx('A haladásod a fiókodba mentődik, minden eszközön elérhető.','Your progress is saved to your account and available on every device.','İlerlemen hesabına kaydediliyor, her cihazda görünür.')}</p>
   <div class="row" style="margin-top:18px"><button class="btn sm" id="logout">${tx('Kijelentkezés','Sign out','Çıkış yap')}</button></div></div></div>`}
function acctWire(){
  const li=$('liBtn');if(li)li.onclick=async()=>{const em=$('liEmail').value.trim();if(!/^\S+@\S+\.\S+$/.test(em)){$('liMsg').textContent=tx('Adj meg egy érvényes e-mail címet.','Enter a valid e-mail address.','Geçerli bir e-posta adresi gir.');return}
    li.disabled=true;$('liMsg').textContent='…';
    const {error}=await sb.auth.signInWithOtp({email:em,options:{emailRedirectTo:location.origin+location.pathname}});
    li.disabled=false;$('liMsg').innerHTML=error?esc(tx('Nem sikerült elküldeni. Próbáld újra pár perc múlva.','Could not send. Please try again in a few minutes.','Gönderilemedi. Birkaç dakika sonra tekrar dene.')):IC('mail')+' '+tx('Elküldtük! Nyisd meg a levelet <b>ebben a böngészőben</b>, és kattints a linkre. (Nézd meg a spam mappát is.)','Sent! Open the e-mail <b>in this browser</b> and click the link. (Check spam too.)','Gönderildi! E-postayı <b>bu tarayıcıda</b> açıp linke tıkla. (Spam klasörüne de bak.)')};

  const rc=$('recheck');if(rc)rc.onclick=async()=>{rc.disabled=true;await loadAccount();chrome();route(true)};
  const lo=$('logout');if(lo)lo.onclick=async()=>{await sb.auth.signOut();USER=null;PREMIUM=false;location.reload()}}

/* ---------- feedback ---------- */
let FBQ=null;
document.addEventListener('click',e=>{const a=e.target.closest('[data-fbq]');if(a)FBQ=+a.dataset.fbq});
function pFeedback(){setTimeout(fbWire);const q=FBQ!=null?QI(FBQ):null;
  const types=[['hiba',tx('Hiba egy kérdésben vagy válaszban','Mistake in a question or answer','Soru veya cevapta hata')],['kerdes',tx('Új vizsgakérdés, amit kaptam','A new exam question I got','Sınavda gelen yeni bir soru')],['otlet',tx('Ötlet / javaslat','Idea / suggestion','Fikir / öneri')],['egyeb',tx('Egyéb','Other','Diğer')]];
  return `<div class="wrap narrow">${crumb(t('feedback'))}<div class="ph"><h1>${t('feedback')}</h1><p class="sub">${tx('Hibát találtál, vagy olyan kérdést kaptál a vizsgán, ami itt nincs? Írd meg!','Found a mistake, or got an exam question that isn’t here? Tell me!','Bir hata mı buldun, ya da sınavda burada olmayan bir soru mu geldi? Yaz bana!')}</p></div>
  <div class="quiz"><form id="fbf" novalidate>
   <label class="fl">${tx('Téma','Topic','Konu')}</label><div class="seg" id="fbt" style="flex-wrap:wrap">${types.map((x,i)=>`<button type="button" data-v="${x[0]}" aria-pressed="${(q?x[0]==='hiba':i===0)}">${x[1]}</button>`).join('')}</div>
   ${q?`<div class="tip" style="margin:0 0 14px"><b>${tx('Kérdés','Question','Soru')}:</b> ${esc(q.q)}<br><span style="color:var(--muted)">${tx('Jelenlegi válasz','Current answer','Mevcut cevap')}: ${esc(q.a.split('|').join(', '))}</span></div>`:''}
   <label class="fl" for="fbm">${tx('Üzenet','Message','Mesaj')} *</label><textarea class="search" id="fbm" rows="6" required maxlength="3000" placeholder="${tx('Írd le röviden…','Describe it briefly…','Kısaca anlat…')}"></textarea>
   <label class="fl" for="fbe">${tx('E-mail (ha választ szeretnél)','E-mail (if you want a reply)','E-posta (cevap istersen)')}</label><input class="search" id="fbe" type="email" autocomplete="email" placeholder="nev@pelda.hu">
   <button class="btn primary" type="submit" id="fbs">${tx('Küldés','Send','Gönder')}</button><p id="fbmsg" style="color:var(--muted);font-size:15px;margin:10px 0 0"></p>
  </form></div></div>`}
function fbWire(){let type=document.querySelector('#fbt [aria-pressed="true"]').dataset.v;
  document.querySelectorAll('#fbt button').forEach(b=>b.onclick=()=>{type=b.dataset.v;document.querySelectorAll('#fbt button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  $('fbf').onsubmit=async e=>{e.preventDefault();const msg=$('fbm').value.trim(),from=$('fbe').value.trim();
    if(!msg){$('fbmsg').textContent=tx('Írj egy üzenetet.','Please write a message.','Lütfen bir mesaj yaz.');$('fbm').focus();return}
    const q=FBQ!=null?QI(FBQ):null,label={hiba:'Hiba',kerdes:'Új kérdés',otlet:'Ötlet',egyeb:'Egyéb'}[type];
    const subject=`[Vizsgafüzet] ${label}${q?': '+q.q.slice(0,60):''}`;
    const body=`${msg}\n\n---\n${q?`Kérdés: ${q.q}\nVálasz az oldalon: ${q.a.split('|').join(', ')}\n`:''}Típus: ${label}\nVálaszcím: ${from||'-'}\nNyelv: ${L.toUpperCase()}`;
    if(FEEDBACK.endpoint){$('fbs').disabled=true;$('fbmsg').textContent='…';
      try{const r=await fetch(FEEDBACK.endpoint,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({subject,message:body,email:from||undefined})});
        if(!r.ok)throw 0;$('fbf').innerHTML=`<h2>✓ ${tx('Köszönöm!','Thank you!','Teşekkürler!')}</h2><p>${tx('Az üzeneted megérkezett.','Your message has been sent.','Mesajın gönderildi.')}</p>`;FBQ=null}
      catch(err){$('fbs').disabled=false;$('fbmsg').textContent=tx('Nem sikerült elküldeni, próbáld újra.','Could not send, please try again.','Gönderilemedi, tekrar dene.')}return}
    if(/CHANGE-ME/.test(FEEDBACK.email)){$('fbmsg').textContent=tx('A visszajelzés még nincs beállítva.','Feedback is not set up yet.','Geri bildirim henüz ayarlanmadı.');return}
    location.href=`mailto:${FEEDBACK.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    $('fbmsg').textContent=tx('Megnyílik a levelezőprogramod – ott nyomd meg a Küldés gombot.','Your mail app will open – press Send there.','E-posta uygulaman açılacak – orada Gönder’e bas.')}}
window.addEventListener('hashchange',()=>route(false));chrome();route(false);initAuth();
</script></body></html>
